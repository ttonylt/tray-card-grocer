<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style>
<title>Tray Card Grocer</title>
<meta name="theme-color" content="#F3EEE4">
<meta name="description" content="A grocery list that checks every food against a person's diet order — sodium, fluids, breathing and more — with real product photos. Made for Houston stores."><meta property="og:title" content="Tray Card Grocer"><meta property="og:description" content="Shop for someone with a diet order. Every food graded OK / Limit / Avoid, with the reason."><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-64.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Tray Card">
<style>
/* Calm ground. Vivid, countable, self-contained units made of real material, carrying their own small
   badges, named by their own tabs. Paper by default; a glass (dark) option under More → Appearance. */
:root{
  --bg:#F3EEE4; --paper2:#E9E3D6; --surface:#FBF8F2; --field:#FFFFFF; --tile:#FFFFFF;
  --ink:#141412; --ink2:#615D55; --ink3:#9B968C; --hair:rgba(20,20,18,.14); --hair2:rgba(20,20,18,.07);
  --sand:#E8B84A; --sand-ink:#141412;
  --ok:#1D8F43; --fluid:#1B6FA8; --limit:#B37A00; --avoid:#C8302A;
  --ok-fill:#1E9E4A; --fluid-fill:#1E7FBF; --limit-fill:#E0A100; --avoid-fill:#D0342C;
  --ok-soft:rgba(30,158,74,.12); --fluid-soft:rgba(30,127,191,.12); --limit-soft:rgba(224,161,0,.16); --avoid-soft:rgba(208,52,44,.12);
  --tile-edge:rgba(20,20,18,.14); --tile-shadow:0 1px 0 rgba(20,20,18,.05),0 2px 6px rgba(40,30,10,.18);
  --island:#101012; --island-ink:#FFFFFF;
  --sat:52%; --lit:46%;
  --r:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
}
:root[data-theme="glass"]{
  color-scheme:dark;
  --bg:#0B0B0D; --paper2:#18181B; --surface:#161618; --field:#1C1C1E; --tile:#FFFFFF;
  --ink:#FFFFFF; --ink2:rgba(255,255,255,.62); --ink3:rgba(255,255,255,.38); --hair:rgba(255,255,255,.14); --hair2:rgba(255,255,255,.07);
  --sand:#E8D5A8; --sand-ink:#141412;
  --ok:#30D158; --fluid:#64D2FF; --limit:#FFD60A; --avoid:#FF453A;
  --ok-fill:#30D158; --fluid-fill:#64D2FF; --limit-fill:#FFD60A; --avoid-fill:#FF453A;
  --ok-soft:rgba(48,209,88,.16); --fluid-soft:rgba(100,210,255,.16); --limit-soft:rgba(255,214,10,.16); --avoid-soft:rgba(255,69,58,.16);
  --tile-edge:rgba(255,255,255,.10); --tile-shadow:0 3px 10px rgba(0,0,0,.65);
  --island:#000000; --island-ink:#FFFFFF;
  --sat:60%; --lit:62%;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;margin:0;color:var(--ink)}
h1{font-size:2.3rem;letter-spacing:-.035em;line-height:1;font-weight:800} h2{font-size:1.35rem} h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--ink)}
::placeholder{color:var(--ink3)}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px));min-height:100%}
/* poster header: huge title flush left, one lozenge, the legend at right */
.poster{display:flex;align-items:flex-end;gap:12px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:14px;min-height:76px}
.lozenge{border:1.5px solid var(--ink);border-radius:999px;padding:5px 11px;font-size:.9rem;font-weight:600;line-height:1;color:var(--ink);margin-bottom:6px;white-space:nowrap}
.legend{margin-left:auto;display:flex;gap:9px;align-items:center;margin-bottom:8px;font-size:.76rem;color:var(--ink2);font-weight:600;white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:4px} .legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend:empty{display:none}
.screen{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--ink2)} .small{font-size:.94rem} .tiny{font-size:.8rem}
.num,.mono{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
/* rows, not cards */
.panel,.foods{border-top:1px solid var(--hair)}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:14px 16px}
.panel-row{display:grid;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair);position:relative}
.section{font-size:1.05rem;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.rule{height:1px;background:var(--hair)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-size:.85rem;color:var(--ink2);padding-left:2px}
.input,select.input,textarea.input{width:100%;background:var(--field);border:1px solid var(--hair);border-radius:var(--r);padding:10px 12px;min-height:46px;color:var(--ink)}
textarea.input{min-height:72px;resize:vertical}
.input:focus,button:focus-visible,.chip:focus-visible,.check input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.money{position:relative}
.money::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2)}
.money .input{padding-left:24px;font-variant-numeric:tabular-nums}
/* buttons: ink on paper, outlined pill as the quiet action */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;color:var(--ink);transition:transform .08s ease,opacity .1s;line-height:1.1;white-space:nowrap}
.btn:active{transform:scale(.98);opacity:.85}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.danger{color:var(--avoid);border-color:var(--avoid)}
.btn.ghost{border-color:transparent;padding-inline:8px}
.btn.sm{min-height:32px;padding:4px 12px;font-size:.88rem}
.btn.block{width:100%}
.btn.wrap{white-space:normal;text-align:left;line-height:1.25;padding-block:9px;flex-direction:column;align-items:flex-start;gap:1px}
.btn.wrap small{display:block;font-weight:500;opacity:.8;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* text chips (used in sheets/forms) */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{flex:0 0 auto;border:1.5px solid var(--hair);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;min-height:36px;font-size:.92rem;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .em{font-family:var(--emoji);font-size:1.05rem;line-height:1}
/* ruled text index (aisles) */
.index{display:flex;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;white-space:nowrap;border-bottom:1px solid var(--hair)}
.index::-webkit-scrollbar{display:none}
.index .chip{border:0;border-radius:0;border-left:1px solid var(--hair);padding:9px 14px 11px;min-height:0;font-size:.95rem;font-weight:600;color:var(--ink2);background:transparent;position:relative}
.index .chip:first-child{border-left:0;padding-left:0}
.index .chip.on{color:var(--ink);background:transparent}
.index .chip.on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--ink)}
.index .chip:first-child.on::after{left:0}
.index .chip .em{display:none}
.filterbar{display:flex;justify-content:flex-end;margin-top:-8px}
.filterbar .btn.ghost{color:var(--ink2);font-weight:600;font-size:.86rem;min-height:30px}
.filterbar .btn.ghost.on{color:var(--ink)}
/* segmented filter: an Apple component, kept small and quiet */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--hair);border-radius:8px;padding:2px;gap:2px;background:var(--surface)}
.seg button{padding:5px 10px;min-height:30px;font-size:.84rem;border-radius:6px;color:var(--ink2);font-weight:600;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 8px;font-size:.82rem;background:var(--paper2);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.ok{color:var(--ok);background:var(--ok-soft)} .tag.fluid{color:var(--fluid);background:var(--fluid-soft)} .tag.limit{color:var(--limit);background:var(--limit-soft)} .tag.avoid{color:var(--avoid);background:var(--avoid-soft)}
.pill{display:inline-flex;align-items:center;border:1px solid var(--hair);border-radius:999px;padding:3px 9px;font-size:.82rem;color:var(--ink2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 8px;font-size:.85rem;white-space:nowrap;background:var(--paper2)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.l0{color:var(--ok)} .badge.l1{color:var(--fluid)} .badge.l2{color:var(--limit)} .badge.l3{color:var(--avoid)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink3);margin-right:6px;vertical-align:1px;flex:0 0 auto}
.dot.l0{background:var(--ok-fill)} .dot.l1{background:var(--fluid-fill)} .dot.l2{background:var(--limit-fill)} .dot.l3{background:var(--avoid-fill)}
.c0{color:var(--ok)} .c1{color:var(--fluid)} .c2{color:var(--limit)} .c3{color:var(--avoid)}
/* HUD readouts: monospace, corner brackets — the diet order as an instrument reading */
.hud{display:inline-flex;align-items:center;gap:5px;position:relative;padding:5px 8px;font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;line-height:1}
.hud b{color:var(--ink);font-weight:600;letter-spacing:.02em;font-size:.74rem}
.hud::before,.hud::after{content:"";position:absolute;width:6px;height:6px;border:1px solid var(--ink3)}
.hud::before{left:0;top:0;border-right:0;border-bottom:0}
.hud::after{right:0;bottom:0;border-left:0;border-top:0}
.hud.l2 b{color:var(--limit)} .hud.l3 b{color:var(--avoid)}
/* the tray card: one object — a stock card with a colour stripe, a folder tab naming the store, a budget badge */
.tray{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start;background:var(--field);border:1px solid var(--hair);border-radius:6px 10px 10px 10px;padding:14px 14px 12px 20px;position:relative;margin-top:14px;box-shadow:var(--tile-shadow);color:var(--ink);text-align:left}
.tray::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:5px 0 0 9px;background:hsl(var(--h) var(--sat) var(--lit))}
.tray .tab{position:absolute;left:-1px;top:-15px;height:22px;padding:0 12px 0 14px;background:var(--paper2);border:1px solid var(--hair);border-bottom:0;border-radius:6px 6px 0 0;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;line-height:1}
.tray .who{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;padding-top:2px}
.tray .budget{justify-self:end;background:var(--sand);color:var(--sand-ink);border-radius:6px;padding:4px 8px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;transform:translate(6px,-6px);white-space:nowrap}
.tray .budget.none{background:var(--paper2);color:var(--ink2);font-weight:600}
.tray .orders{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.tray .line{grid-column:1/-1;font-size:.9rem;color:var(--ink2);margin-top:2px;padding-right:20px;line-height:1.35}
.tray .chev{position:absolute;right:12px;bottom:10px;color:var(--ink3);font-size:1.3rem;line-height:1;font-weight:300}
.tray .note{grid-column:1/-1;font-size:.84rem;color:var(--ink2)}
/* search */
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink2);pointer-events:none}
.search .input{padding-left:38px;border-radius:var(--r)}
/* product tiles: white stock with an edge and a shadow — an object, with its badge on the corner */
.thumb{width:56px;height:56px;border-radius:12px;background:var(--tile);border:1px solid var(--tile-edge);display:inline-grid;place-items:center;font-family:var(--emoji);font-size:30px;line-height:1;flex:0 0 auto;overflow:hidden;position:relative;color:#111}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.ph img{position:absolute;inset:0;background:#fff;object-fit:cover}
.thumb .em{font-style:normal}
.thumb.ph .em{display:none}
.thumb.lg{width:76px;height:76px;font-size:40px;border-radius:16px}
.thumb.sm{width:44px;height:44px;font-size:24px;border-radius:10px}
.tile{position:relative;display:inline-block;flex:0 0 auto;line-height:0}
.tile .thumb{box-shadow:var(--tile-shadow)}
.tbadge{position:absolute;right:-7px;bottom:-7px;background:#111214;color:#fff;border-radius:999px;font-size:.66rem;font-weight:700;padding:3px 6px 3px 5px;line-height:1;display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--bg);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbadge i{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--ok-fill)}
.tbadge.l1 i{background:var(--fluid-fill)} .tbadge.l2 i{background:var(--limit-fill)} .tbadge.l3 i{background:var(--avoid-fill)}
.pdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:hsl(var(--h) var(--sat) var(--lit));flex:0 0 auto}
.avatar{width:12px;height:12px;border-radius:50%;background:hsl(var(--h) var(--sat) var(--lit));display:inline-block;flex:0 0 auto;font-size:0;color:transparent}
.avatar.lg{width:14px;height:14px}
/* food rows */
.food{display:grid;grid-template-columns:64px 1fr 92px;gap:2px 14px;align-items:center;padding:13px 0;position:relative;border-bottom:1px solid var(--hair)}
.food.l3 .thumb{opacity:.55}
.food .body{min-width:0;cursor:pointer}
.food .name{font-weight:600;font-size:1.02rem;letter-spacing:-.01em;line-height:1.25}
.food .sub{font-size:.84rem;color:var(--ink2);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.food .sub.c3{color:var(--avoid)} .food .sub.c2{color:var(--limit)} .food .sub.c1{color:var(--fluid)}
.food .sub b{font-weight:600}
.food .act{display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-self:end;width:92px}
.food .price{font-size:.82rem;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;line-height:1.2}
.food .price b{color:var(--ink);font-weight:600}
.add{height:32px;min-width:64px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;font-size:.88rem;display:inline-grid;place-items:center;transition:transform .08s ease}
.add:active{transform:scale(.96)}
.qty{display:inline-flex;align-items:center;border-radius:999px;overflow:hidden;background:var(--ink);color:var(--bg);height:32px}
.qty button{width:32px;height:32px;font-size:1.1rem;color:inherit;line-height:1;display:grid;place-items:center}
.qty span{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:.92rem}
.food .detail{grid-column:1/-1;margin-top:8px;padding-top:10px;border-top:1px dashed var(--hair);display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.detail .reason{display:flex;gap:8px;align-items:flex-start}
.detail .reason .dot{flex:0 0 9px;height:9px;margin:6px 0 0}
.nutri{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.nutri div{background:var(--surface);border:1px solid var(--hair2);border-radius:8px;padding:7px 9px;font-size:.74rem;color:var(--ink2)}
.nutri b{display:block;font-size:.95rem;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
/* list */
.listhead{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--hair)}
.listhead .warn{grid-column:1/-1;font-size:.88rem;color:var(--avoid);margin-top:4px}
.listhead .sub{color:var(--ink2);font-size:.9rem}
.listhead .bar{grid-column:1/-1;margin-top:6px}
.listhead .meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;color:var(--ink2)}
.cartrow{display:grid;grid-template-columns:auto auto 1fr;gap:6px 12px;align-items:center;padding:12px 0;position:relative;border-bottom:1px solid var(--hair)}
.cartrow.got .name{text-decoration:line-through;color:var(--ink2)}
.cartrow.got .thumb{opacity:.45}
.cartrow .name{font-weight:600;font-size:1rem;letter-spacing:-.01em}
.cartrow .sub{font-size:.84rem;color:var(--ink2)}
.cartrow .controls{grid-column:3/4;display:flex;align-items:center;gap:10px}
.cartrow .pricebtn{font-size:.9rem;color:var(--ink2);padding:6px 2px;font-variant-numeric:tabular-nums;text-decoration:underline dotted var(--ink3);text-underline-offset:3px}
.cartrow .linetotal{margin-left:auto;font-weight:600;color:var(--ink);font-size:.95rem}
.cartrow .qty{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.cartrow .money{width:104px}
.cartrow .money .input{min-height:32px;padding-block:3px;border-radius:999px;padding-left:22px}
.cartrow .money::before{left:10px}
.linetotal{font-variant-numeric:tabular-nums}
.check{display:inline-flex;align-items:center;gap:8px}
.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border:1.5px solid var(--ink3);border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--ink);border-color:var(--ink)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* the island: one black lozenge, one line of truth, the thing to do next */
.sumbar{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;justify-content:center;padding-inline:12px;pointer-events:none}
.island{pointer-events:auto;background:var(--island);color:var(--island-ink);border-radius:999px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 28px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);font-variant-numeric:tabular-nums;font-size:.95rem;font-weight:600;max-width:100%;white-space:nowrap;color:var(--island-ink)}
.island i{width:8px;height:8px;border-radius:50%;background:var(--sand);display:inline-block;flex:0 0 auto}
.island .dim{color:rgba(255,255,255,.55);font-weight:500}
.island .dim.over{color:#FF6B6B}
.island .go{background:#fff;color:#000;border-radius:999px;padding:7px 12px;font-size:.86rem;font-weight:700;margin-left:4px;line-height:1}
.bar{height:2px;background:var(--hair);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.bar.warn i{background:var(--limit-fill)} .bar.over i{background:var(--avoid-fill)}
.total{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--hair);padding:7px 8px calc(4px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabbar button{padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.64rem;font-weight:600;color:var(--ink3);min-height:52px;position:relative}
.tabbar button.on{color:var(--ink)}
.tabbar svg{width:26px;height:26px;stroke-width:2.2}

.empty{text-align:center;padding:28px 16px;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}

.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--hair);margin:4px auto 4px}
@media (min-width:640px){.sheet{border-radius:18px;padding-top:18px}.sheet::before{display:none}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--island);color:var(--island-ink);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:60;box-shadow:0 10px 30px -12px rgba(0,0,0,.4);max-width:90vw;text-align:center;border:1px solid rgba(255,255,255,.14)}

.confirm{background:var(--avoid-soft);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.confirm .small{color:var(--ink)}
/* people: each person is a tray card */
.people{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.tray.person{margin-top:0;cursor:default}
.tray.person .count{justify-self:end;background:var(--paper2);color:var(--ink2);border-radius:6px;padding:4px 8px;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;transform:translate(6px,-6px);white-space:nowrap}
.tray.person .note{margin-top:2px}
.tray.person .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--hair2)}
.tray.person .foot .actions{display:flex;gap:8px}
.person{grid-template-columns:auto 1fr auto}
.person h3{font-size:1.1rem}
.person .orders{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:2px}
.person .meta{grid-column:1/-1;color:var(--ink2);font-size:.86rem}
.person .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pick{display:flex;flex-direction:column}
.pick button{display:flex;align-items:center;gap:12px;width:100%;border-bottom:1px solid var(--hair);padding:12px 4px;min-height:56px;color:var(--ink)}
.pick button.on .lbl::after{content:"  ✓";font-weight:700}
.pick .lbl{font-weight:600}
.pick .sub{display:block;color:var(--ink2);font-size:.85rem;font-weight:400}
/* conditions form */
.condlist{display:flex;flex-direction:column}
.cond{padding:10px 4px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--hair)}
.cond.on .top label{font-weight:600}
.cond .top{display:flex;align-items:center;gap:10px}
.cond .top label{flex:1;cursor:pointer}
.cond .param{display:flex;align-items:center;gap:8px;padding-left:36px;font-size:.92rem}
.cond .param .input{width:120px;min-height:36px;padding-block:5px;font-variant-numeric:tabular-nums}
/* trips */
.monthhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
.monthhead span{font-weight:500;color:var(--ink2);font-size:.85rem;font-variant-numeric:tabular-nums}
.trip{grid-template-columns:auto 1fr auto;cursor:pointer}
.trip .when{font-weight:600}
.trip .sub{color:var(--ink2);font-size:.86rem}
.trip .amt{font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums}
.trip .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.trip .actions .danger{margin-left:auto}
.trip .items{grid-column:1/-1;margin-top:6px;border-top:1px dashed var(--hair);padding-top:8px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.trip .items .line{display:flex;justify-content:space-between;gap:8px}
.trip .items .miss{color:var(--ink2);text-decoration:line-through}
.stats{display:flex;flex-wrap:wrap;gap:8px 10px}
.stat{display:inline-flex;flex-direction:column;gap:3px;position:relative;padding:8px 12px 9px;min-width:100px}
.stat::before,.stat::after{content:"";position:absolute;width:8px;height:8px;border:1px solid var(--ink3)}
.stat::before{left:0;top:0;border-right:0;border-bottom:0} .stat::after{right:0;bottom:0;border-left:0;border-top:0}
.stat .k{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.stat b{font-size:1.25rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.stat .s{font-size:.78rem;color:var(--ink2)}
details.guide{border-bottom:1px solid var(--hair)}
details.guide summary{padding:12px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"›";color:var(--ink3);font-size:1.4rem;line-height:1;transform:rotate(90deg);transition:transform .15s}
details.guide[open] summary::after{transform:rotate(-90deg)}
details.guide .body{padding:0 0 14px;font-size:.95rem;display:flex;flex-direction:column;gap:8px;max-width:65ch;color:var(--ink2)}
details.guide .body b{color:var(--ink)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv b{white-space:nowrap}

.emojigrid button{border:1px solid var(--hair);background:var(--field);border-radius:10px;height:44px;font-family:var(--emoji);font-size:22px;display:grid;place-items:center}
.emojigrid button.on{box-shadow:inset 0 0 0 2px var(--ink)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

// ===== Conditions (diet orders) and the grading rules =====
const CONDITIONS = [
  {id:"sodium", name:"Low sodium (heart failure, high blood pressure)", short:"Sodium", param:{label:"Daily sodium limit", unit:"mg", def:2000, min:500, max:4000, step:100}},
  {id:"fluid", name:"Fluid restriction", short:"Fluid", param:{label:"Daily fluid limit", unit:"mL", def:1500, min:500, max:4000, step:50}},
  {id:"resp", name:"Chronic respiratory failure / COPD", short:"Breathing"},
  {id:"diabetes", name:"Diabetes (sugar & carb control)", short:"Diabetes", param:{label:"Sugar per serving that gets flagged", unit:"g", def:12, min:5, max:30, step:1}},
  {id:"ckd", name:"Kidney disease (potassium & phosphorus)", short:"Kidney"},
  {id:"hik", name:"High potassium / on potassium-raising meds (spironolactone, lisinopril, losartan)", short:"High K"},
  {id:"lok", name:"Needs extra potassium (on water pills like furosemide / Lasix)", short:"Needs K"},
  {id:"heart", name:"Cholesterol / heart-healthy fats", short:"Cholesterol"},
  {id:"warfarin", name:"On warfarin (Coumadin) — steady vitamin K", short:"Warfarin"},
  {id:"gerd", name:"Acid reflux (GERD)", short:"Reflux"},
  {id:"gout", name:"Gout", short:"Gout"},
  {id:"soft", name:"Soft / easy-chew diet (swallowing or dental trouble)", short:"Soft diet"},
  {id:"lactose", name:"Lactose intolerance", short:"Lactose"},
  {id:"gluten", name:"Gluten-free (celiac)", short:"Gluten-free"},
  {id:"noalc", name:"No alcohol", short:"No alcohol"},
  {id:"fiber", name:"Constipation (needs fiber)", short:"Fiber"},
];
const COND = Object.fromEntries(CONDITIONS.map(c => [c.id, c]));
const ALLERGENS = [
  {id:"peanut", name:"peanuts"}, {id:"nut", name:"tree nuts"}, {id:"shell", name:"shellfish"}, {id:"fish", name:"fish"},
  {id:"egg", name:"eggs"}, {id:"soy", name:"soy"}, {id:"wheat", name:"wheat"}, {id:"dairy", name:"milk / dairy"}, {id:"sesame", name:"sesame"},
];
const ALLERGEN_NAME = Object.fromEntries(ALLERGENS.map(a => [a.id, a.name]));
const LEVELS = [
  {cls:"l0", label:"OK", word:"ok"},
  {cls:"l1", label:"Counts as fluid", word:"fluid"},
  {cls:"l2", label:"Limit", word:"limit"},
  {cls:"l3", label:"Avoid", word:"avoid"},
];

// Grade one food against one person's diet order.
// Returns {lvl 0..3, reasons:[{lvl,text}], goods:[text], infos:[text]}
function gradeFood(f, p){
  const c = (p && p.conds) || {};
  const al = (p && p.allergies) || [];
  const R = [], G = [], I = [];
  const has = t => f.tags.includes(t);
  const pct = (v, lim) => Math.round(v / lim * 100);
  const fmt = n => Number(n).toLocaleString();

  al.forEach(a => { if (has(a)) R.push({lvl:3, text:`Contains ${ALLERGEN_NAME[a]} — allergy.`}); });

  if (c.sodium){
    const L = +c.sodium || 2000, hi = Math.round(L * 0.2);
    if (f.na > hi) R.push({lvl:3, text:`High sodium: ${fmt(f.na)} mg per ${f.serving} — ${pct(f.na, L)}% of the ${fmt(L)} mg day. Look for a "no salt added" version.`});
    else if (has("proc") && f.na > 250) R.push({lvl:3, text:`Cured / processed meat: ${fmt(f.na)} mg per ${f.serving}, and salt is the preservative — a real portion is usually double. Fresh or "no salt added" instead.`});
    else if (f.na > 140) R.push({lvl:2, text:`Moderate sodium: ${f.na} mg per ${f.serving} (${pct(f.na, L)}% of the day). One serving, keep the rest of the day low.`});
    else if (f.na === 0) G.push("Sodium-free");
    else G.push(`Low sodium (${f.na} mg)`);
    if (has("checkinj")) I.push('Check the package: "enhanced", "seasoned" or "contains up to 15% solution" means salt water was added — pick plain.');
    if (has("ksub")) I.push("Potassium-based. Fine for many people, but ask the doctor first if there is any kidney trouble or a potassium-raising medicine (spironolactone, lisinopril, losartan).");
    if (has("grapefruit")) R.push({lvl:2, text:"Grapefruit interacts with many heart, blood-pressure and cholesterol medicines (amiodarone, statins, some BP pills). Ask the pharmacist first."});
    if (has("alc")) R.push({lvl:2, text:"Alcohol strains a weak heart and clashes with heart medicines. Most heart-failure plans say little or none."});
  }

  if (c.fluid){
    const F = +c.fluid || 1500;
    if (f.fl > 0){
      const pc = pct(f.fl, F);
      if (f.fl >= F / 3) R.push({lvl:2, text:`Big pour: ${fmt(f.fl)} mL is ${pc}% of the whole day's ${fmt(F)} mL. Pour a small cup instead of drinking the whole thing.`});
      else R.push({lvl:1, text:`Counts as fluid: ${fmt(f.fl)} mL per ${f.serving} = ${pc}% of the ${fmt(F)} mL day.`});
    }
    if (has("wet")) I.push("Very watery food. Most fluid plans don't count it, but some do — ask the dietitian.");
    if (has("thirst") && f.fl === 0) G.push("Helps thirst without adding fluid");
    if (!c.sodium && f.na > 400) R.push({lvl:2, text:`Salty (${fmt(f.na)} mg) — salt makes you thirsty and hold water.`});
  }

  if (c.resp){
    if (has("carb")) R.push({lvl:2, text:"Carbonation bloats the stomach and pushes on the diaphragm — breathing gets harder."});
    if (has("gas")) R.push({lvl:2, text:"Gas-forming food. Bloating crowds the lungs — small portions, cooked soft."});
    if (has("fried")) R.push({lvl:2, text:"Greasy / fried food sits heavy and causes bloating."});
    if (f.sugar >= 20) R.push({lvl:2, text:`High sugar (${f.sugar} g). A load of simple carbs makes extra CO₂ for tired lungs to clear.`});
    if (has("chew")) R.push({lvl:2, text:"Tough to chew — tiring when short of breath. Choose tender or ground cuts."});
    if (!c.sodium && f.na > 400) R.push({lvl:2, text:`Salty (${fmt(f.na)} mg) — salt holds fluid, which strains breathing.`});
    if (has("protein")) G.push("Good protein — breathing muscles need it");
    if (has("caff")) I.push("Caffeine can clash with some breathing medicines — check with the pharmacist.");
  }

  if (c.diabetes){
    const Sg = +c.diabetes || 12;
    if (f.fl > 0 && f.sugar >= 10) R.push({lvl:3, text:`Sugary drink (${f.sugar} g sugar) — hits the blood sugar fast.`});
    else if (f.sugar >= Sg * 2) R.push({lvl:3, text:`Very high sugar: ${f.sugar} g per ${f.serving}.`});
    else if (f.sugar >= Sg) R.push({lvl:2, text:`Sugar: ${f.sugar} g per ${f.serving} — small portion, with a meal.`});
    if (f.carb >= 45) R.push({lvl:2, text:`Heavy carbs: ${f.carb} g per serving (about ${Math.round(f.carb / 15)} carb choices).`});
    if (f.fiber >= 4) G.push(`Fiber (${f.fiber} g) slows the sugar rise`);
    if (f.sugar === 0 && f.carb <= 5 && f.fl === 0 && (has("protein") || f.prot >= 10)) G.push("Protein, no sugar");
  }

  if (c.ckd){
    if (f.k >= 400) R.push({lvl:3, text:`High potassium: ${fmt(f.k)} mg per ${f.serving}.`});
    else if (f.k >= 250) R.push({lvl:2, text:`Moderate potassium: ${f.k} mg — small portion.`});
    if (has("phos")) R.push({lvl:3, text:'Phosphorus additives (look for "phos" in the ingredient list).'});
    else if (has("hiphos")) R.push({lvl:2, text:"Naturally high in phosphorus — limit."});
    if (has("ksub")) R.push({lvl:3, text:"Potassium-chloride salt substitute — dangerous with kidney disease."});
    if (!c.sodium && f.na > 400) R.push({lvl:2, text:`Salty (${fmt(f.na)} mg).`});
  }

  if (c.hik){
    if (f.k >= 400) R.push({lvl:3, text:`High potassium: ${fmt(f.k)} mg per ${f.serving} — the medicine already raises potassium.`});
    else if (f.k >= 250) R.push({lvl:2, text:`Moderate potassium: ${f.k} mg — small portion.`});
    if (has("ksub")) R.push({lvl:3, text:"Potassium-chloride salt substitute — avoid with potassium-raising medicines."});
  }

  if (c.lok){
    if (f.k >= 300) G.push(`Good potassium (${f.k} mg) — replaces what water pills flush out`);
    if (has("ksub")) I.push("Salt substitute adds potassium — only if the doctor said so.");
  }

  if (c.heart){
    if (f.sf >= 8) R.push({lvl:3, text:`Very high saturated fat: ${f.sf} g per ${f.serving}.`});
    else if (f.sf >= 5) R.push({lvl:2, text:`Saturated fat: ${f.sf} g per ${f.serving}.`});
    if (has("fried")) R.push({lvl:2, text:"Fried."});
    if (has("proc")) R.push({lvl:2, text:"Processed meat — saturated fat and salt."});
    if (has("omega")) G.push("Heart-healthy fats");
    if (f.fiber >= 4) G.push(`Fiber (${f.fiber} g)`);
    if (has("grapefruit") && !c.sodium) R.push({lvl:2, text:"Grapefruit interacts with statins and some blood-pressure medicines — ask the pharmacist."});
  }

  if (c.warfarin){
    if (has("vitk")) R.push({lvl:2, text:"High vitamin K. Fine to eat — just eat about the same amount every week so the warfarin dose stays steady."});
    if (has("alc")) R.push({lvl:2, text:"Alcohol changes how warfarin works."});
    if (has("grapefruit") && !c.sodium && !c.heart) R.push({lvl:2, text:"Grapefruit can change medicine levels — ask the pharmacist."});
  }

  if (c.gerd){
    const t = [];
    if (has("acid")) t.push("acidic");
    if (has("spicy")) t.push("spicy");
    if (has("caff")) t.push("caffeine");
    if (has("carb")) t.push("carbonated");
    if (has("fried")) t.push("fried");
    if (has("alc")) t.push("alcohol");
    if (f.sf >= 5 && !has("fried")) t.push("high-fat");
    if (t.length) R.push({lvl:2, text:`Reflux trigger: ${t.join(", ")}. Small amounts, not near bedtime.`});
  }

  if (c.gout){
    if (has("purine2")) R.push({lvl:3, text:"Very high purines — raises uric acid."});
    else if (has("purine")) R.push({lvl:2, text:"Moderate purines — small portions."});
    if (has("alc")) R.push({lvl:3, text:"Alcohol (especially beer) triggers gout flares."});
    if (f.fl > 0 && f.sugar >= 20) R.push({lvl:2, text:"Sugary drink — fructose raises uric acid."});
  }

  if (c.soft){
    if (has("hard") || has("chew")) R.push({lvl:3, text:"Hard, crunchy or tough — choking risk. Pick soft foods or cook until very soft."});
    else if (has("dry") || has("sticky")) R.push({lvl:2, text:"Dry or sticky — hard to swallow. Moisten it or skip."});
    else if (has("soft")) G.push("Soft texture");
  }

  if (c.lactose){
    if (has("lactose")) R.push({lvl:2, text:"High lactose — gas, cramps, diarrhea. A lactose-free version usually exists."});
    else if (has("dairy")) I.push("Dairy, but low in lactose (aged cheese, yogurt, butter) — usually tolerated.");
  }

  if (c.gluten){
    if (has("gluten") || has("wheat")) R.push({lvl:3, text:"Contains gluten."});
    else if (has("oats")) R.push({lvl:2, text:"Oats — only if the label says certified gluten-free."});
  }

  if (c.noalc && has("alc")) R.push({lvl:3, text:"Alcohol."});
  if (c.fiber && f.fiber >= 4) G.push(`Good fiber (${f.fiber} g) — helps constipation`);
  if (has("flavor")) G.push("Salt-free flavor");

  R.sort((a, b) => b.lvl - a.lvl);
  const lvl = R.length ? R[0].lvl : 0;
  return {lvl, reasons:R, goods:[...new Set(G)], infos:[...new Set(I)]};
}

// What to look for on the real package, for the active person's conditions
function labelTips(p){
  const c = (p && p.conds) || {}; const t = [];
  if (c.sodium){ const L = +c.sodium || 2000; t.push(`Sodium: 140 mg or less per serving is low. Over ${Math.round(L*0.2)} mg — put it back.`); }
  if (c.fluid) t.push("Fluid: anything liquid at room temperature counts. 1 cup = 240 mL, 8 fl oz = 240 mL, a 16.9 oz bottle = 500 mL.");
  if (c.resp) t.push("Breathing: skip carbonated drinks and gas-makers; pick high-protein, soft, small-portion foods.");
  if (c.diabetes) t.push("Diabetes: read Total Sugars and Total Carbohydrate per serving.");
  if (c.ckd || c.hik) t.push('Potassium: read the Potassium line; skip anything with "phos" in the ingredients.');
  if (c.heart) t.push("Fats: Saturated fat 5 g or less per serving, 0 g trans fat.");
  if (c.gluten) t.push('Gluten: look for "gluten-free" on the front; wheat, barley, rye and malt mean no.');
  if (c.soft) t.push("Texture: it should mash with a fork.");
  return t;
}

// Summary chips for a person's conditions
// The diet order as instrument readouts: [{k:"Sodium", v:"≤ 2,000 mg"}, …] — for the tray card and People rows.
function orderReadouts(p){
  const c = (p && p.conds) || {}; const out = [];
  CONDITIONS.forEach(cd => { if (c[cd.id]){
    if (cd.id === "sodium") out.push({k:"Sodium", v:`≤ ${(+c.sodium).toLocaleString()} mg`});
    else if (cd.id === "fluid") out.push({k:"Fluid", v:`≤ ${(+c.fluid).toLocaleString()} mL`});
    else if (cd.id === "diabetes") out.push({k:"Diabetes", v:`sugar > ${(+c.diabetes).toLocaleString()} g`});
    else if (cd.param && typeof c[cd.id] === "number") out.push({k:cd.short, v:`${c[cd.id].toLocaleString()} ${cd.param.unit || ""}`.trim()});
    else out.push({k:cd.short});
  }});
  ((p && p.allergies) || []).forEach(a => out.push({k:"No " + ALLERGEN_NAME[a]}));
  return out;
}
const hudHTML = r => `<span class="hud">${esc(r.k)}${r.v ? ` <b>${esc(r.v)}</b>` : ""}</span>`;
function condChips(p){
  const c = (p && p.conds) || {}; const out = [];
  CONDITIONS.forEach(cd => { if (c[cd.id]){
    let s = cd.short;
    if (cd.id === "sodium") s = `${(+c.sodium/1000).toLocaleString(undefined,{maximumFractionDigits:1})} g sodium`;
    if (cd.id === "fluid") s = `${(+c.fluid).toLocaleString()} mL fluid`;
    out.push(s);
  }});
  ((p && p.allergies) || []).forEach(a => out.push(`No ${ALLERGEN_NAME[a]}`));
  return out;
}

  built:false

function cartFor(pid){
  const key = pid || "_none";
  if (!S.carts[key]) S.carts[key] = {storeId:null, budget:0, items:[]};
  return S.carts[key];
}
// S.cart always means "the selected person's list"
Object.defineProperty(S, "cart", { get(){ const p = activeProfile(); return cartFor(p ? p.id : null); } });

function buildCart(){

    const it = S.cart.items.find(i => i.id === id);

    if (act === "dec" && it){ it.qty -= 1; if (it.qty <= 0) S.cart.items = S.cart.items.filter(i => i.id !== id); Store.saveCart(); }
    if (act === "remove" && it){ S.cart.items = S.cart.items.filter(i => i.id !== id); Store.saveCart(); toast(`${it.name || "Item"} removed`); }
    if (act === "finish") openFinishModal();
    if (act === "gocart") setTab("cart");

    if (act === "cancel"){ S.ui.confirm = null; renderCart(); }
    if (act === "clear"){ S.cart.items = []; S.ui.confirm = null; Store.saveCart(); toast("List cleared"); }
    if (act === "goshop") setTab("shop");
    if (act === "trip") openTripSheet();

    const line = e.target.closest(".cartrow"); if (!line) return; const it = S.cart.items.find(i => i.id === line.dataset.id); if (!it) return;
    if (e.target.dataset.act === "got"){ it.got = e.target.checked; Store.saveCart(); }
    if (e.target.dataset.act === "price"){ it.price = Math.max(0, +e.target.value || 0); Store.saveCart(); }
  });

    if (e.target.dataset.act !== "price") return;
    const line = e.target.closest(".cartrow"); const it = S.cart.items.find(i => i.id === line.dataset.id); if (!it) return;

function buildHistory(){

      if (t.storeId && S.stores[t.storeId]) S.cart.storeId = t.storeId;
      const st = activeStore();
      t.items.forEach(ti => { const f = foodById(ti.id); if (!f) return; const ex = S.cart.items.find(i => i.id === ti.id); if (ex) ex.qty += ti.qty; else S.cart.items.push({id:ti.id, qty:ti.qty, price:priceFor(f, st), got:false, name:f.name}); });

function shrinkImage(file, size){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { try{
      const c = document.createElement("canvas"); c.width = size; c.height = size; const ctx = c.getContext("2d");
      const s = Math.min(im.width, im.height); const sx = (im.width - s) / 2, sy = (im.height - s) / 2;
      ctx.drawImage(im, sx, sy, s, s, 0, 0, size, size); URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.82));
    }catch(e){ reject(e); } };
    im.onerror = reject; im.src = url;
  });
}
// On a plain website (no Claude runtime) hand the file to the browser the normal way.
function plainDownload(filename, data, type){
  try{
    const blob = new Blob([data], {type}); const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; a.rel = "noopener"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); return true;
  }catch(e){ return false; }
}

const GUIDE = [
  {t:"How the colors work", b:`<p><span class="badge l0">OK</span> fits every diet order the person has.</p><p><span class="badge l1">Counts as fluid</span> fine to buy, but every sip comes out of the day's fluid allowance — the card shows how much.</p><p><span class="badge l2">Limit</span> small portion, once in a while, or a caution about medicines. Read the reason.</p><p><span class="badge l3">Avoid</span> breaks a rule outright (very high sodium, an allergy, alcohol on a no-alcohol order). Look for the swap suggested in the reason.</p><p class="muted">Numbers are typical values for a generic version of the food. Brands differ, so the app also tells you what to look for on the real label.</p>`},
  {t:"2 g sodium diet (heart failure, blood pressure)", b:`<p>2 grams = 2,000 mg a day, spread over all meals and snacks. Most of the salt in a diet comes from packaged food, not the shaker.</p><ul><li><b>Low sodium</b> on a label means 140 mg or less per serving — the target for most items.</li><li><b>Very low</b> = 35 mg or less. <b>Sodium-free</b> = under 5 mg.</li><li><b>Reduced sodium</b> only means 25% less than the regular version — soy sauce and soups can still be very high.</li><li><b>No salt added</b> is the phrase to hunt for on canned vegetables, beans, tomatoes, broth and tuna.</li><li>Anything over 400 mg per serving (20% of the day) is a put-it-back item.</li></ul><p><b>Biggest offenders:</b> deli meat, bacon, sausage, hot dogs, canned soup, ramen, frozen dinners, pizza, cheese, pickles, olives, soy sauce, seasoning salts, bouillon, biscuits, boxed rice and pasta mixes.</p><p><b>Swaps:</b> fresh or frozen plain meat instead of deli; no-salt-added cans, or rinse regular canned beans and vegetables (drops sodium by about a third); Swiss or fresh mozzarella instead of cheddar or American; salt-free seasoning blends, garlic and onion powder, lemon, vinegar, pepper, fresh herbs for flavor.</p><p>Chicken, pork and shrimp are sometimes injected with salt water — the package says "enhanced" or "contains up to 15% solution". Buy plain.</p>`},
  {t:"1,500 mL fluid restriction", b:`<p>Everything that is liquid at room temperature counts, not just water: coffee, tea, milk, juice, soda, soup and broth, nutrition shakes, ice (half its volume), ice cream, sherbet, popsicles, Jell-O, pudding, yogurt, gravy, creamer.</p><div class="kv"><b>1 cup / 8 fl oz</b><span>240 mL</span><b>1 fl oz</b><span>30 mL</span><b>16.9 oz water bottle</b><span>500 mL — a third of the day</span><b>12 oz can</b><span>355 mL</span><b>Popsicle</b><span>about 75 mL</span><b>Jell-O or pudding cup</b><span>about 100 mL</span><b>Scoop of ice cream</b><span>about 120 mL</span><b>Bowl of soup</b><span>240–360 mL</span></div><p><b>Making it easier:</b> use small cups; spread fluids through the day; take pills with meal fluids instead of an extra glass; sugar-free hard candy or gum, a lemon wedge, or rinsing and spitting for a dry mouth; avoid salty food, which drives thirst.</p><p>Many heart-failure plans also ask for a daily morning weight. A gain of 2–3 lb in a day or 5 lb in a week usually means call the clinic — that is fluid, not fat.</p>`},
  {t:"Chronic respiratory failure / COPD", b:`<ul><li><b>Small, frequent meals</b> (5–6 a day). A full stomach pushes up on the diaphragm and makes breathing harder.</li><li><b>Skip gas-makers</b> and carbonated drinks: beans, cabbage, broccoli, cauliflower, Brussels sprouts, onions, corn, soda, sparkling water, fried food.</li><li><b>Protein at every meal</b> — eggs, chicken, fish, Greek yogurt, cottage cheese, protein shakes. Breathing burns calories, and the breathing muscles need protein.</li><li><b>Go easy on sugar and refined carbs.</b> Burning a big load of simple carbs produces extra carbon dioxide that tired lungs have to clear. Healthy fats (olive oil, avocado, nuts, fish) are a gentler fuel.</li><li><b>Salt</b> makes the body hold fluid, which strains breathing — the sodium rule helps here too.</li><li><b>Soft, easy-to-chew foods</b> on short-of-breath days; rest before meals, eat slowly, sit upright.</li><li>Fluids thin mucus, but a doctor's fluid restriction always wins over "drink more".</li><li>If on steroid pills or inhalers long term, calcium and vitamin D (milk, yogurt, fortified foods) protect the bones.</li></ul>`},
  {t:"Other diet orders you can turn on", b:`<ul><li><b>Diabetes</b> — watches Total Sugars and Total Carbohydrate per serving; sugary drinks are red. Fiber gets a green note.</li><li><b>Kidney disease</b> — flags potassium (250 mg+ limit, 400 mg+ avoid) and phosphorus additives (any ingredient with "phos"). Never use potassium-chloride salt substitute.</li><li><b>High potassium / potassium-raising meds</b> (spironolactone, lisinopril, losartan) — same potassium flags.</li><li><b>Needs extra potassium</b> (water pills like furosemide/Lasix) — bananas, potatoes, oranges, tomatoes, yogurt get a green note. Ask the doctor which potassium rule applies; they conflict.</li><li><b>Cholesterol</b> — saturated fat 5 g+ per serving is a limit; fried and processed meats too.</li><li><b>Warfarin</b> — leafy greens are fine, just keep the amount steady week to week.</li><li><b>Reflux</b> — acidic, spicy, fried, fatty, caffeine, carbonated, alcohol.</li><li><b>Gout</b> — organ meats and sardines avoid; shellfish and beer limit.</li><li><b>Soft diet</b> — hard, crunchy or tough foods are red; soft gets a green note.</li><li><b>Lactose</b> — milk and ice cream limit; aged cheese and yogurt usually fine.</li><li><b>Gluten-free</b> — wheat, barley, rye, most bread, pasta, crackers, soy sauce and beer are red; oats only if certified.</li><li><b>Allergies</b> — anything containing the allergen is red.</li></ul>`},
  {t:"Shopping and price tips", b:`<ul><li>Shop the outside walls first: produce, meat, dairy, frozen plain vegetables. Most red items live in the middle aisles.</li><li>"Heart healthy", "natural" and "organic" on the front say nothing about sodium. Turn it over.</li><li>Bulk clubs are fine for staples — portion big packs into freezer bags the day you get home.</li><li>Prices here start as estimates. Fix a price on any item (open it → Fix price) and the app remembers it for that store; prices you enter at checkout are remembered too.</li><li>Finish Trip saves the receipt total, what was bought and what was skipped, so next week you can tap "Shop this list again".</li><li>Everything stays on your own phone or computer. Other people can use this same page for their own family — nobody sees anyone else's lists.</li></ul>`}
];

// ===== Boot =====
// ?demo fills the screen with sample data (Grandma, two stores, a list, two trips) and never saves it —
// used for the tutorial screenshots and for trying the page without touching anyone's real data.
function seedDemo(){
  S.demo = true; Store.saveLocal = function(){ this.ok = true; };
  const pid = "p_demo"; S.profiles[pid] = {...GRANDMA_PRESET, conds:{...GRANDMA_PRESET.conds}, allergies:[], created:1, id:pid}; S.sel.profileId = pid;
  S.stores.heb = {name:"H-E-B", type:"grocery", note:"", created:1, id:"heb"}; S.stores.sams = {name:"Sam's Club", type:"warehouse", note:"", created:2, id:"sams"};
  const cart = cartFor(pid); cart.storeId = "heb"; cart.budget = 85;
  ["bananas","chickenbreast","milk2","oats","saltines","bacon"].forEach(id => { const f = foodById(id); if (f) cart.items.push({id, qty:1, price:priceFor(f, S.stores.heb), got:false, name:f.name}); });
  S.trips.t1 = {id:"t1", date:todayISO(), storeId:"heb", storeName:"H-E-B", profileId:pid, profileName:"Grandma", budget:85, total:21.34, note:"", created:2, items:cart.items.slice(0,5).map(i => ({...i, got:true}))};
  S.trips.t2 = {id:"t2", date:"2026-09-14", storeId:"sams", storeName:"Sam's Club", profileId:pid, profileName:"Grandma", budget:120, total:96.12, note:"Bulk chicken", created:1, items:[{id:"chickenbreast", name:"Chicken breast, boneless", qty:2, price:18.99, got:true}]};
}
function boot(){
  buildShop(); buildCart(); buildHistory(); buildPeople(); buildMore();
  $("#tabbar").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
  S.built = true;
  Store.loadLocal();
  if (/(^|[?&])demo(=|&|$)/.test(location.search) && !profileList().length) seedDemo();
  const params = new URLSearchParams(location.search);
  const catParam = params.get("cat"); if (catParam && CATS.includes(catParam)) S.ui.cat = catParam;
  const qParam = params.get("q"); if (qParam){ S.ui.q = qParam; const qi = $("#q"); if (qi) qi.value = qParam; }
  const h = (location.hash || "").slice(1); if (["shop","cart","history","people","more"].includes(h)) S.ui.tab = h;
  setSync(); render();
}
boot();
</script>
