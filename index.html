<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style>
<title>Tray Card Grocer</title>
<meta name="theme-color" content="#F3EEE4">
<meta name="description" content="A grocery list that checks every food against a person's diet order — sodium, fluids, breathing and more — with real product photos. Made for Houston stores."><meta property="og:title" content="Tray Card Grocer"><meta property="og:description" content="Shop for someone with a diet order. Every food graded OK / Limit / Avoid, with the reason."><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-64.png"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-title" content="Tray Card">
<style>
/* Shelf & Tray. Real products stand on shelves over a quiet paper ground; each one wears a shelf tag.
   Picking one moves it: "+" drops it into the black tray at the bottom, tapping it brings it forward
   and it goes back to its place. Controls are keys that press down. Numbers read like instruments.
   Type: one display voice (serif), one label voice (mono), body in between. Three sizes: 13 / 16 / 34. */
:root{
  --bg:#F3EEE4; --paper2:#E9E3D6; --surface:#FBF8F2; --field:#FFFFFF; --tile:#FFFFFF; --label:#FFFFFF; --label-edge:rgba(20,20,18,.13);
  --ink:#141412; --ink2:#615D55; --ink3:#9B968C; --hair:rgba(20,20,18,.14); --hair2:rgba(20,20,18,.07);
  --sand:#E8B84A; --sand-ink:#141412;
  --ok:#1D8F43; --fluid:#1B6FA8; --limit:#9A6800; --avoid:#C8302A;
  --ok-fill:#1E9E4A; --fluid-fill:#1E7FBF; --limit-fill:#E0A100; --avoid-fill:#D0342C;
  --ok-soft:rgba(30,158,74,.12); --fluid-soft:rgba(30,127,191,.12); --limit-soft:rgba(224,161,0,.17); --avoid-soft:rgba(208,52,44,.12);
  --zone-bg:var(--bg);
  --plank-top:#EAE3D5; --plank-face:#D6CCB8; --plank-shadow:rgba(70,52,20,.22);
  --key-hi:#FFFFFF; --key:#EFE9DE; --key-side:#C4BAA6; --key-edge:rgba(20,20,18,.17); --key-shadow:rgba(60,44,14,.20); --key-gloss:rgba(255,255,255,.95); --key-down:#E4DDCF; --key-ink:#141412;
  --tray-top:#1D1D20; --tray-bot:#0B0B0D; --tray-ink:#FFFFFF;
  --tile-edge:rgba(20,20,18,.14); --tile-shadow:0 1px 0 rgba(20,20,18,.05),0 2px 6px rgba(40,30,10,.18);
  --island:#101012; --island-ink:#FFFFFF;
  --sat:52%; --lit:46%;
  --r:10px; --tabbar-h:72px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;
  --t-l:13px; --t-b:16px; --t-d:34px; --t-h:26px;
}
:root[data-theme="glass"]{
  color-scheme:dark;
  --bg:#0B0B0D; --paper2:#18181B; --surface:#161618; --field:#1C1C1E; --tile:#FFFFFF; --label:#1C1C1E; --label-edge:rgba(255,255,255,.10);
  --ink:#FFFFFF; --ink2:rgba(255,255,255,.62); --ink3:rgba(255,255,255,.38); --hair:rgba(255,255,255,.14); --hair2:rgba(255,255,255,.07);
  --sand:#E8C46A; --sand-ink:#141412;
  --ok:#30D158; --fluid:#64D2FF; --limit:#FFD60A; --avoid:#FF453A;
  --ok-fill:#30D158; --fluid-fill:#64D2FF; --limit-fill:#FFD60A; --avoid-fill:#FF453A;
  --ok-soft:rgba(48,209,88,.16); --fluid-soft:rgba(100,210,255,.16); --limit-soft:rgba(255,214,10,.16); --avoid-soft:rgba(255,69,58,.18);
  --zone-bg:#FFFFFF;
  --plank-top:#303034; --plank-face:#1E1E21; --plank-shadow:rgba(0,0,0,.6);
  --key-hi:#3B3B40; --key:#2A2A2E; --key-side:#050506; --key-edge:rgba(0,0,0,.7); --key-shadow:rgba(0,0,0,.5); --key-gloss:rgba(255,255,255,.13); --key-down:#1F1F22; --key-ink:#FFFFFF;
  --tray-top:#2A2A2E; --tray-bot:#141416;
  --tile-edge:rgba(255,255,255,.10); --tile-shadow:0 3px 10px rgba(0,0,0,.65);
  --island:#000000; --island-ink:#FFFFFF;
  --sat:60%; --lit:62%;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-b);line-height:1.35;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
h1,h2,h3{margin:0;color:var(--ink)}
h1{font:700 var(--t-d)/1 var(--serif);letter-spacing:-.01em}
h2{font:700 var(--t-h)/1.1 var(--serif);letter-spacing:-.01em}
h3{font:600 var(--t-b)/1.3 var(--font)}
p{margin:0}
a{color:var(--ink)}
::placeholder{color:var(--ink3)}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom,0px));min-height:100%}
/* poster header: the page's name in the display voice, one mono label at right */
.poster{display:flex;align-items:flex-end;gap:10px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:12px;min-height:62px}
.lozenge{border:1.5px solid var(--ink);border-radius:6px;padding:4px 7px;font:500 var(--t-l)/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin-bottom:5px;white-space:nowrap}
.legend{margin-left:auto;display:flex;gap:9px;align-items:center;margin-bottom:6px;font:var(--t-l)/1 var(--mono);text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:4px} .legend b{color:var(--ink);font-weight:600}
.legend:empty{display:none}
.screen{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--ink2)} .small{font-size:var(--t-b)} .tiny{font-size:var(--t-l)}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.panel,.foods{border-top:1px solid var(--hair)}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:14px 16px}
.panel-row{display:grid;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair);position:relative}
.section,.kicker{font:500 var(--t-l)/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.rule{height:1px;background:var(--hair)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font:500 var(--t-l)/1.25 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding-left:2px}
.field > label .muted{text-transform:none}
.input,select.input,textarea.input{width:100%;background:var(--field);border:1px solid var(--hair);border-radius:var(--r);padding:10px 12px;min-height:46px;color:var(--ink);font-size:var(--t-b);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
textarea.input{min-height:72px;resize:vertical}
.input:focus,button:focus-visible,.chip:focus-visible,.check input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.money{position:relative}
.money::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2);font-family:var(--mono)}
.money .input{padding-left:26px;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- keys: every button is a key with a skirt; pressing it pushes it down ---- */
.btn,.chip,.seg button,button.k,.cap{background:linear-gradient(180deg,var(--key-hi),var(--key));color:var(--key-ink);border:1px solid var(--key-edge);
  box-shadow:0 3px 0 var(--key-side),0 5px 8px -3px var(--key-shadow),inset 0 1px 0 var(--key-gloss);transition:transform .07s ease,box-shadow .07s ease}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:0 16px;min-height:46px;font-weight:600;line-height:1.1;white-space:nowrap;margin-bottom:3px}
.btn:active,.chip:active,.seg button:active,button.k:active{transform:translateY(3px);box-shadow:0 0 0 var(--key-side),0 1px 2px var(--key-shadow),inset 0 1px 3px rgba(0,0,0,.12)}
.btn.primary{background:linear-gradient(180deg,#303034,#141416);color:#fff;border-color:#000;box-shadow:0 3px 0 #000,0 5px 9px -3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18)}
:root[data-theme="glass"] .btn.primary{background:linear-gradient(180deg,#FFFFFF,#E4E0D8);color:#111;border-color:#000;box-shadow:0 3px 0 #77736B,0 5px 9px -3px rgba(0,0,0,.6),inset 0 1px 0 #fff}
.btn.danger{color:var(--avoid)}
.btn.primary.danger{background:linear-gradient(180deg,#D8433A,#B32820);color:#fff;border-color:#6d1510;box-shadow:0 3px 0 #6d1510,0 5px 9px -3px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;padding-inline:8px;margin-bottom:0}
.btn.ghost:active{transform:none;opacity:.6}
.btn.sm{min-height:32px;padding:0 10px;border-radius:8px;font:500 var(--t-l)/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;box-shadow:0 2px 0 var(--key-side),0 4px 6px -3px var(--key-shadow),inset 0 1px 0 var(--key-gloss);margin-bottom:2px}
.btn.sm:active{transform:translateY(2px)}
.btn.sm.primary{box-shadow:0 2px 0 #000,0 4px 6px -3px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.sm.ghost{box-shadow:none}
.btn.block{width:100%}
.btn.wrap{white-space:normal;text-align:left;line-height:1.25;padding-block:10px;flex-direction:column;align-items:flex-start;gap:3px}
.btn.wrap small{display:block;font:500 var(--t-l)/1.3 var(--mono);text-transform:uppercase;letter-spacing:.03em;opacity:.8}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* selectable keys: the chosen one stays pressed in and its LED is lit */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:-16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{flex:0 0 auto;border-radius:9px;padding:0 12px;min-height:38px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;margin-bottom:3px}
.chip.on,.seg button.on{transform:translateY(3px);background:var(--key-down);box-shadow:0 0 0 var(--key-side),inset 0 2px 4px rgba(0,0,0,.16);font-weight:600}
.chip.on::before,.seg button.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sand);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 5px rgba(232,184,74,.85);flex:0 0 auto}
.chip .em{font-family:var(--emoji);font-size:1.05rem;line-height:1}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:0 10px;min-height:32px;font:500 var(--t-l)/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;margin-bottom:3px}
/* a slide switch */
.switch{position:relative;width:44px;height:26px;border-radius:13px;background:var(--paper2);box-shadow:inset 0 1px 3px rgba(0,0,0,.28);flex:0 0 auto;transition:background .16s}
.switch i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#fff,#E9E4DA);box-shadow:0 1px 2px rgba(0,0,0,.35),inset 0 -1px 1px rgba(0,0,0,.08);transition:transform .18s cubic-bezier(.3,.7,.4,1)}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"] i{transform:translateX(18px)}
.check{display:inline-flex;align-items:center}
.check input{appearance:none;-webkit-appearance:none;width:30px;height:30px;margin:0 0 3px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--key-hi),var(--key));border:1px solid var(--key-edge);box-shadow:0 3px 0 var(--key-side),inset 0 1px 0 var(--key-gloss);transition:transform .07s,box-shadow .07s}
.check input:checked{transform:translateY(3px);background:var(--ink);border-color:var(--ink);box-shadow:inset 0 2px 3px rgba(0,0,0,.35)}
.check input:checked::after{content:"";width:7px;height:12px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* little square keys used on tags and rows */
button.k{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;font:600 20px/1 var(--font);margin-bottom:3px;flex:0 0 auto}
button.k svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
.lcd{min-width:22px;text-align:center;font:600 var(--t-b)/1 var(--mono);font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;gap:3px}
.qty button{display:inline-grid;place-items:center}
.qty span{min-width:22px;text-align:center;font:600 var(--t-b)/1 var(--mono);font-variant-numeric:tabular-nums}

/* ---- data marks ---- */
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 7px;font:500 var(--t-l)/1.2 var(--mono);text-transform:uppercase;background:var(--paper2);color:var(--ink2);white-space:nowrap}
.pill{display:inline-flex;align-items:center;border:1px solid var(--hair);border-radius:999px;padding:3px 9px;font-size:var(--t-l);color:var(--ink2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 8px;font:500 var(--t-l)/1.2 var(--mono);text-transform:uppercase;white-space:nowrap;background:var(--paper2)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.l0{color:var(--ok)} .badge.l1{color:var(--fluid)} .badge.l2{color:var(--limit)} .badge.l3{color:var(--avoid)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink3);margin-right:6px;vertical-align:1px;flex:0 0 auto}
.dot.l0{background:var(--ok-fill)} .dot.l1{background:var(--fluid-fill)} .dot.l2{background:var(--limit-fill)} .dot.l3{background:var(--avoid-fill)}
.c0{color:var(--ok)} .c1{color:var(--fluid)} .c2{color:var(--limit)} .c3{color:var(--avoid)}
.lv0{--lvl:var(--ok);--lvl-fill:var(--ok-fill);--lvl-soft:var(--ok-soft)}
.lv1{--lvl:var(--fluid);--lvl-fill:var(--fluid-fill);--lvl-soft:var(--fluid-soft)}
.lv2{--lvl:var(--limit);--lvl-fill:var(--limit-fill);--lvl-soft:var(--limit-soft)}
.lv3{--lvl:var(--avoid);--lvl-fill:var(--avoid-fill);--lvl-soft:var(--avoid-soft)}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75) 0 18%,transparent 34%),var(--lvl-fill,var(--ink3));box-shadow:0 0 0 1px rgba(0,0,0,.14),inset 0 -1px 1px rgba(0,0,0,.25)}
.hud{display:inline-flex;align-items:center;gap:5px;position:relative;padding:5px 8px;font:var(--t-l)/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.hud b{color:var(--ink);font-weight:600;letter-spacing:.02em}
.hud::before,.hud::after{content:"";position:absolute;width:6px;height:6px;border:1px solid var(--ink3)}
.hud::before{left:0;top:0;border-right:0;border-bottom:0}
.hud::after{right:0;bottom:0;border-left:0;border-top:0}
.hud.l2 b{color:var(--limit)} .hud.l3 b{color:var(--avoid)}
/* the price sticker: the one bit of culture on a screen — it always carries the budget */
.sticker{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--sand);color:var(--sand-ink);border-radius:5px;padding:5px 8px 6px;transform:rotate(-3deg);box-shadow:0 1px 0 rgba(0,0,0,.12),0 3px 6px -3px rgba(60,40,0,.4);white-space:nowrap;line-height:1}
.sticker small{font:600 var(--t-l)/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;opacity:.72}
.sticker b{font:700 var(--t-b)/1 var(--mono);font-variant-numeric:tabular-nums}
.sticker.none{background:var(--paper2);color:var(--ink2);box-shadow:none}

/* ---- the trip card: a stock card with a folder tab naming the store, and the budget sticker ---- */
.tray{width:100%;display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;background:var(--field);border:1px solid var(--hair);border-radius:6px 10px 10px 10px;padding:11px 12px 11px 18px;position:relative;margin-top:14px;box-shadow:var(--tile-shadow);color:var(--ink);text-align:left}
.tray::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:5px 0 0 9px;background:hsl(var(--h) var(--sat) var(--lit))}
.tray .tab{position:absolute;left:-1px;top:-15px;height:22px;padding:0 12px 0 14px;background:var(--paper2);border:1px solid var(--hair);border-bottom:0;border-radius:6px 6px 0 0;font:500 var(--t-l)/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center}
.tray .who{font:600 var(--t-b)/1.2 var(--font)}
.tray .budget{grid-row:1/3;grid-column:2}
.tray .orders{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:8px}
.tray .line{grid-column:1;font:var(--t-l)/1.3 var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--ink2)}
.tray .chev{display:none}
.tray .note{grid-column:1/-1;font-size:var(--t-l);color:var(--ink2)}
.tray:active{transform:translateY(1px)}

/* ---- aisles: index tabs on top of the shelf unit, with a search key first ---- */
.aislebar{position:sticky;top:var(--stick-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:8px 16px 0;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--hair)}
.aislebar button.k.find{width:38px;height:34px;margin-bottom:6px}
.index{display:flex;overflow-x:auto;scrollbar-width:none;white-space:nowrap;flex:1 1 auto;min-width:0;padding:2px 24px 0 26px;margin-left:-26px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 28px),transparent)}
.aislebar.tabsonly .index{margin-left:-26px}
.index::-webkit-scrollbar{display:none}
.index .chip{border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;box-shadow:none;background:none;padding:9px 11px 10px;min-height:0;font:500 var(--t-l)/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin:0 0 -1px;position:relative;transform:none}
.index .chip i{font-style:normal;color:var(--ink3);margin-right:5px}
.index .chip.on{background:var(--surface);border-color:var(--hair);color:var(--ink);font-weight:600;transform:none;box-shadow:none;z-index:1}
.index .chip.on::before{display:none}
.index .chip.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--surface)}
.index .chip:active{transform:none}
.findbar{display:flex;gap:8px;align-items:center;padding-bottom:8px;flex:1 1 auto}
.search{position:relative;flex:1 1 auto}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink2);pointer-events:none}
.search .input{padding-left:38px;min-height:42px}
/* the sign on the shelf unit: which aisle, how many, and the Avoid switch */
.shelfhead{display:flex;align-items:center;gap:10px;background:var(--surface);margin:-16px -16px 0;padding:10px 16px 12px;border-bottom:1px solid var(--hair2);font:var(--t-l)/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.shelfhead{flex-wrap:wrap;row-gap:6px}
.shelfhead b{color:var(--ink);font-weight:600}
.shelfhead .tally{display:flex;gap:12px;flex-wrap:wrap}
.shelfhead .t{display:inline-flex;align-items:center;gap:5px}
.shelfhead .t b{font-weight:600}
.shelfhead .sw{margin-left:auto;display:inline-flex;align-items:center;gap:8px;cursor:pointer}

/* ---- shelves: products stand on planks, each with a hanging shelf tag ---- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));margin:6px -16px 0;padding:0 8px;row-gap:22px}
.slot{position:relative;min-width:0;padding:0 8px}
.pkg{display:block;width:100%;position:relative;cursor:pointer}
.pkg::after{content:"";position:absolute;left:-8px;right:-8px;bottom:-10px;height:10px;background:linear-gradient(180deg,var(--plank-top) 0 3px,var(--plank-face) 3px 100%);box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 10px -8px var(--plank-shadow);pointer-events:none}
.zone{display:block;position:relative;overflow:hidden;background:var(--zone-bg);isolation:isolate}
.zone img{position:absolute;max-width:none;height:auto;mix-blend-mode:multiply;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.zone .em{display:none;font-style:normal}
.zone.noimg img:not(.own){display:none}
.zone.noimg .em{display:grid;place-items:end center;position:absolute;inset:0;font-family:var(--emoji);line-height:1;color:#111}
.zone img.own{mix-blend-mode:normal;left:50%;top:auto;bottom:0;height:88%;width:auto;aspect-ratio:1/1;object-fit:cover;transform:translateX(-50%);border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.z-shelf{width:100%;aspect-ratio:16/11}
.z-shelf.noimg .em{font-size:64px;padding-bottom:4%}
:root[data-theme="glass"] .z-shelf,:root[data-theme="glass"] .z-sheet{border-radius:12px 12px 0 0}
.slot.lv3 .zone img{opacity:.5;filter:grayscale(.3)}
.zone.away img,.zone.away .em{visibility:hidden}
.pkg .have{position:absolute;right:4px;top:4px;z-index:2;background:var(--ink);color:var(--bg);border-radius:6px;padding:4px 6px;font:600 var(--t-l)/1 var(--mono);font-variant-numeric:tabular-nums}
.stag{display:flex;flex-direction:column;margin-top:10px;background:var(--label);border:1px solid var(--label-edge);border-top:0;border-radius:0 0 5px 5px;box-shadow:0 3px 5px -3px rgba(40,30,10,.25);position:relative}
.stag .band{display:flex;align-items:center;gap:6px;padding:5px 8px 4px;background:var(--lvl-soft);color:var(--lvl);font:600 var(--t-l)/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.stag .band .n{margin-left:auto;color:var(--ink);font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stag .nm{margin:7px 8px 0;font:600 var(--t-b)/1.25 var(--font);letter-spacing:-.01em;height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.stag .foot{display:flex;align-items:center;gap:6px;padding:6px 8px 7px;min-height:48px}
.stag .px{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:2px;line-height:1.1}
.stag .px b{font:600 var(--t-b)/1.1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stag .px b small,.cents small{font-size:var(--t-l);font-weight:500;color:var(--ink2);margin-right:1px}
.stag .px span{font:var(--t-l)/1.15 var(--mono);text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stag .qty{gap:2px}
.stag button.k.add{width:38px;height:38px;border-radius:9px}
.stag button.k.add svg{width:18px;height:18px}
.stag .qty button.k{width:30px;height:30px}
.empty{text-align:center;padding:28px 16px;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}

/* ---- the item, brought forward: same product, bigger, annotated on the object ---- */
.sheet.item{gap:12px;padding-top:6px}
.item .top{display:flex;align-items:center;gap:8px;font:var(--t-l)/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.item .top .btn{margin-left:auto}
.item .fig{position:relative;margin-bottom:10px}
.item .fig::after{content:"";position:absolute;left:-16px;right:-16px;bottom:-10px;height:10px;background:linear-gradient(180deg,var(--plank-top) 0 3px,var(--plank-face) 3px 100%);box-shadow:0 8px 10px -8px var(--plank-shadow)}
.z-sheet{width:62%;aspect-ratio:16/11}
.z-sheet.noimg .em{font-size:96px;padding-bottom:4%}
.item .lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.item .lines line{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.item .pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 var(--t-l)/1 var(--mono);box-shadow:0 0 0 2px var(--bg)}
.item .co{position:absolute;left:66%;right:0;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
.item .co .kk{font:var(--t-l)/1.1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);display:flex;gap:5px;align-items:center}
.item .co .kk i{font-style:normal;color:var(--ink)}
.item .co .v{font:600 var(--t-b)/1.1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .co .v small{font-size:var(--t-l);font-weight:500;color:var(--ink2)}
.gauge{display:flex;gap:2px;margin-top:2px}
.gauge i{width:7px;height:6px;border-radius:1px;background:var(--hair)}
.gauge i.on{background:var(--lvl-fill,var(--ink))}
.item .head{display:flex;flex-direction:column;gap:8px}
.stamp{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--lvl);color:var(--lvl);border-radius:5px;padding:4px 8px;font:700 var(--t-l)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;transform:rotate(-2deg);box-shadow:inset 0 0 0 1px var(--bg),inset 0 0 0 2px var(--lvl)}
.item .why{display:flex;flex-direction:column;gap:8px}
.reason{display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.reason .led,.reason .dot{margin-top:5px}
.facts{font:var(--t-l)/1.5 var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--ink2);border-top:1px dashed var(--hair);border-bottom:1px dashed var(--hair);padding:8px 0}
.facts b{color:var(--ink);font-weight:600}
.pricebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pricebar .px{margin-right:auto;font:var(--t-l)/1.3 var(--mono);text-transform:uppercase;color:var(--ink2)}
.pricebar .px b{font:600 var(--t-b)/1 var(--mono);color:var(--ink)}
.item .onlist{display:flex;align-items:center;gap:10px;justify-content:space-between}
.item .onlist .qty button.k{width:44px;height:44px;font-size:24px}
.item .onlist .qty span{min-width:34px;font-size:var(--t-b)}
.detail .reason .dot{flex:0 0 9px;height:9px;margin:6px 0 0}
.nutri{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.nutri div{background:var(--surface);border:1px solid var(--hair2);border-radius:8px;padding:7px 9px;font-size:var(--t-l);color:var(--ink2)}
.nutri b{display:block;font-size:var(--t-b);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- the list: what's in the tray, laid out; checked items move down into the cart ---- */
.listhead{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.listhead .who{display:flex;align-items:center;gap:8px;font:600 var(--t-b)/1.2 var(--font)}
.listhead .sub{font:var(--t-l)/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.listhead .warn{grid-column:1/-1;font-size:var(--t-b);color:var(--avoid)}
.listhead .keys{display:flex;gap:6px;align-items:center}
.group{display:flex;justify-content:space-between;align-items:baseline;font:var(--t-l)/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);padding:10px 0 8px;border-bottom:1px solid var(--hair)}
.group b{color:var(--ink);font-weight:600}
.cartrow{display:grid;grid-template-columns:auto 52px 1fr auto;gap:0 12px;align-items:center;padding:10px 0;position:relative;border-bottom:1px solid var(--hair);background:var(--bg)}
.cartrow .z-row{width:52px;aspect-ratio:1/1;border-radius:6px}
:root[data-theme="glass"] .cartrow .z-row{border-radius:8px}
.z-row.noimg .em{font-size:32px;place-items:center}
.cartrow.got .name{text-decoration:line-through;color:var(--ink2)}
.cartrow.got .zone img,.cartrow.got .zone .em{opacity:.45}
.cartrow .body{min-width:0}
.cartrow .name{font:600 var(--t-b)/1.25 var(--font);letter-spacing:-.01em}
.cartrow .sub{font:var(--t-l)/1.35 var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--ink2);margin-top:3px}
.cartrow .sub b{font-weight:600}
.cartrow .act{display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-self:end}
.pricebtn{font:inherit;color:var(--ink2);padding:0;text-transform:inherit;letter-spacing:inherit;font-variant-numeric:tabular-nums;text-decoration:underline dotted var(--ink3);text-underline-offset:3px}
.linetotal{font:600 var(--t-b)/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.cartrow .money{width:104px}

/* ---- the tray: a black molded tray docked above the keys; picked products land in it ---- */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));z-index:25;display:flex;justify-content:center;padding:0 10px 8px;pointer-events:none}
.traybox{pointer-events:auto;position:relative;width:100%;max-width:560px;height:66px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-radius:18px;color:var(--tray-ink);
  background:linear-gradient(180deg,var(--tray-top),var(--tray-bot));border:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 26px -8px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.25)}
.traybox::before{content:"";position:absolute;inset:6px;border-radius:13px;box-shadow:inset 0 2px 6px rgba(0,0,0,.85),inset 0 -1px 0 rgba(255,255,255,.07);pointer-events:none}
.pile{display:flex;align-items:center;flex:0 1 auto;min-width:0;padding-left:12px;height:100%}
.pc{position:relative;width:42px;height:42px;margin-left:-12px;border-radius:9px;background:var(--zone-bg);transform:rotate(var(--r,0deg));box-shadow:0 3px 6px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.06);flex:0 0 auto;overflow:visible}
.pc .zone{width:100%;height:100%;border-radius:9px}
.z-pile.noimg .em{font-size:26px;place-items:center}
.pc.landing .zone img,.pc.landing .zone .em{visibility:hidden}
.pc .q{position:absolute;right:-6px;top:-7px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:#fff;color:#111;font:600 var(--t-l)/19px var(--mono);text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.pmore{margin-left:6px;font:600 var(--t-l)/1 var(--mono);color:rgba(255,255,255,.7);white-space:nowrap}
.readout{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;margin-left:auto;position:relative}
.traybox.bare .readout{margin-left:6px}
.traybox.bare .go{margin-left:auto}
.big{font:600 var(--t-d)/.9 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:inline-flex;align-items:flex-start;white-space:nowrap}
.big small{font:600 var(--t-l)/1 var(--mono);margin:2px 2px 0 0;opacity:.7}
.readout .lab{font:500 var(--t-l)/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.62);white-space:nowrap}
.readout .lab b{color:#fff;font-weight:600} .readout .lab b.over{color:#FF7B72}
.odo{display:inline-flex;height:.9em;overflow:hidden}
.odo .dg{display:inline-block;height:.9em;overflow:hidden}
.odo .strip{display:flex;flex-direction:column;transition:transform .5s cubic-bezier(.2,.9,.25,1)}
.odo .strip b{display:block;height:.9em;line-height:.9;font-weight:inherit}
.odo .ch{display:inline-block}
.traybox .go{position:relative;align-self:center;height:38px;padding:0 12px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;margin-bottom:3px;
  background:linear-gradient(180deg,#FFFFFF,#E6E2DA);color:#111;font:600 var(--t-l)/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;box-shadow:0 3px 0 #8E897F,inset 0 1px 0 #fff;transition:transform .07s,box-shadow .07s;flex:0 0 auto}
.traybox:active .go{transform:translateY(3px);box-shadow:0 0 0 #8E897F,inset 0 1px 3px rgba(0,0,0,.2)}
.meter{display:flex;gap:2px;margin-top:1px}
.meter i{width:8px;height:5px;border-radius:1px;background:rgba(255,255,255,.16)}
.meter i.on{background:var(--sand)}
.bar{height:2px;background:var(--hair);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.bar.warn i{background:var(--limit-fill)} .bar.over i{background:var(--avoid-fill)}
.total{font:600 var(--t-d)/1 var(--mono);font-variant-numeric:tabular-nums}

/* ---- the keys row (tab bar): five keys; the current one is pressed in with its LED lit ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--hair);padding:8px 10px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:8px;min-height:var(--tabbar-h)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink2);position:relative;min-width:0}
.tabbar .cap{position:relative;width:100%;max-width:66px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--key-ink)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 var(--key-gloss))}
.tabbar .lbl{font:500 var(--t-l)/1 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.tabbar .cap .led{position:absolute;left:7px;top:6px;width:5px;height:5px;background:rgba(0,0,0,.14);box-shadow:inset 0 1px 1px rgba(0,0,0,.2)}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .cap{transform:translateY(3px);background:var(--key-down);box-shadow:0 0 0 var(--key-side),inset 0 2px 4px rgba(0,0,0,.18)}
.tabbar button.on .cap .led{background:var(--sand);box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 6px rgba(232,184,74,.9)}
.tabbar button:active .cap{transform:translateY(3px);box-shadow:0 0 0 var(--key-side),inset 0 2px 4px rgba(0,0,0,.14)}
.tabbar .count{position:absolute;top:-7px;right:-7px;background:var(--ink);color:var(--bg);border-radius:6px;font:600 var(--t-l)/1 var(--mono);padding:3px 5px;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--bg)}
@media (min-width:900px){
  :root{--stick-top:70px}
  .tabbar{position:sticky;top:0;bottom:auto;border:0;border-bottom:1px solid var(--hair);margin-bottom:8px;max-width:760px;margin-inline:auto;padding:8px 6px 8px;background:var(--bg);min-height:0}
  .app{padding-bottom:140px}
  .dock{bottom:16px}
  .poster{padding-top:8px}
}

/* ---- sheets ---- */
.overlay{position:fixed;inset:0;background:rgba(20,20,18,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease-out}
@media (min-width:640px){.overlay{align-items:center}}
.sheet{background:var(--bg);color:var(--ink);border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:sheetIn .26s cubic-bezier(.2,.8,.2,1)}
.sheet.item{animation:none}
.sheet::before{content:"";display:block;flex:0 0 auto;width:36px;height:5px;border-radius:3px;background:var(--hair);margin:4px auto 4px}
@media (min-width:640px){.sheet{border-radius:18px;padding-top:18px}.sheet::before{display:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--island);color:var(--island-ink);padding:9px 16px;border-radius:12px;font-size:var(--t-b);z-index:80;box-shadow:0 10px 30px -12px rgba(0,0,0,.4);max-width:90vw;text-align:center;border:1px solid rgba(255,255,255,.14)}
body.has-sum .toast{bottom:calc(var(--tabbar-h) + 88px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.toast{bottom:24px} body.has-sum .toast{bottom:100px}}
.confirm{background:var(--avoid-soft);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.confirm .small{color:var(--ink)}
.flyer{position:fixed;z-index:70;pointer-events:none;transform-origin:0 0;background:var(--zone-bg);isolation:isolate;overflow:hidden;border-radius:3px;will-change:transform}
.flyer.cut{background:transparent;mix-blend-mode:multiply;border-radius:0}
.flyer img{position:absolute;max-width:none;height:auto;mix-blend-mode:multiply}
.flyer.whole{overflow:hidden}
.flyer.whole .em{display:grid;place-items:center;position:absolute;inset:0;font-family:var(--emoji);font-style:normal;font-size:40px}
#flyRoot{pointer-events:none}

/* ---- people: each person is a trip card ---- */
.people{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.tray.person{margin-top:0;cursor:default;align-items:start}
.tray.person .who{font-size:var(--t-b)}
.tray.person .count{justify-self:end;background:var(--paper2);color:var(--ink2);border-radius:6px;padding:4px 8px;font:var(--t-l)/1 var(--mono);text-transform:uppercase;white-space:nowrap}
.tray.person .note{margin-top:2px}
.tray.person .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--hair2)}
.tray.person .foot .actions{display:flex;gap:8px}
.person{grid-template-columns:auto 1fr auto}
.person h3{font-size:var(--t-b)}
.person .orders{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:2px}
.person .meta{grid-column:1/-1;color:var(--ink2);font-size:var(--t-l)}
.person .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pick{display:flex;flex-direction:column}
.pick button{display:flex;align-items:center;gap:12px;width:100%;border-bottom:1px solid var(--hair);padding:12px 4px;min-height:56px;color:var(--ink)}
.pick button.on .lbl::after{content:"  ✓";font-weight:700}
.pick .lbl{font-weight:600}
.pick .sub{display:block;color:var(--ink2);font:var(--t-l)/1.3 var(--mono);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.pdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:hsl(var(--h) var(--sat) var(--lit));flex:0 0 auto}
.avatar{width:12px;height:12px;border-radius:50%;background:hsl(var(--h) var(--sat) var(--lit));display:inline-block;flex:0 0 auto;font-size:0;color:transparent}
.avatar.lg{width:14px;height:14px}
/* legacy product tile (forms, settings) */
.thumb{width:56px;height:56px;border-radius:12px;background:var(--tile);border:1px solid var(--tile-edge);display:inline-grid;place-items:center;font-family:var(--emoji);font-size:30px;line-height:1;flex:0 0 auto;overflow:hidden;position:relative;color:#111}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.ph img{position:absolute;inset:0;background:#fff;object-fit:cover}
.thumb .em{font-style:normal}
.thumb.ph .em{display:none}
.thumb.lg{width:76px;height:76px;font-size:40px;border-radius:16px}
.thumb.sm{width:44px;height:44px;font-size:24px;border-radius:10px}
.tile{position:relative;display:inline-block;flex:0 0 auto;line-height:0}
.tile .thumb{box-shadow:var(--tile-shadow)}
.tbadge{position:absolute;right:-7px;bottom:-7px;background:#111214;color:#fff;border-radius:999px;font:600 11px/1 var(--mono);padding:3px 6px 3px 5px;display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--bg);white-space:nowrap}
.tbadge i{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--ok-fill)}
.tbadge.l1 i{background:var(--fluid-fill)} .tbadge.l2 i{background:var(--limit-fill)} .tbadge.l3 i{background:var(--avoid-fill)}
/* conditions form */
.condlist{display:flex;flex-direction:column}
.cond{padding:10px 4px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--hair)}
.cond.on .top label{font-weight:600}
.cond .top{display:flex;align-items:center;gap:10px}
.cond .top label{flex:1;cursor:pointer}
.cond .param{display:flex;align-items:center;gap:8px;padding-left:36px;font-size:var(--t-b)}
.cond .param .input{width:120px;min-height:38px;padding-block:5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
/* trips */
.monthhead{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 8px;font:600 var(--t-l)/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.monthhead span{font-weight:500;color:var(--ink2)}
.trip{grid-template-columns:auto 1fr auto;cursor:pointer}
.trip .when{font-weight:600}
.trip .sub{color:var(--ink2);font:var(--t-l)/1.35 var(--mono);letter-spacing:.03em;text-transform:uppercase;margin-top:2px}
.trip .amt{font:600 var(--t-b)/1 var(--mono);font-variant-numeric:tabular-nums}
.trip .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.trip .actions .danger{margin-left:auto}
.trip .items{grid-column:1/-1;margin-top:6px;border-top:1px dashed var(--hair);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.trip .items .line{display:flex;justify-content:space-between;gap:8px}
.trip .items .line .num{font-family:var(--mono)}
.trip .items .miss{color:var(--ink2);text-decoration:line-through}
.stats{display:grid;grid-template-columns:1.25fr 1fr;gap:4px 10px;align-items:stretch}
.stat{display:flex;flex-direction:column;justify-content:center;gap:4px;position:relative;padding:10px 12px}
.stat::before,.stat::after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--ink3)}
.stat::before{left:0;top:0;border-right:0;border-bottom:0} .stat::after{right:0;bottom:0;border-left:0;border-top:0}
.stat .k{font:500 var(--t-l)/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.stat b{font:600 var(--t-b)/1.1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.stat .s{font:var(--t-l)/1 var(--mono);text-transform:uppercase;color:var(--ink2)}
.stat.hero{grid-row:1/3}
.stat:not(.hero)::before,.stat:not(.hero)::after{display:none}
.stat:not(.hero){border-left:1px solid var(--hair);padding:6px 0 6px 12px}
.stat b small{font:600 var(--t-l)/1 var(--mono);opacity:.7;margin-right:2px;vertical-align:top}
.aislebar.tabsonly{position:static;padding-top:0}
.stat.hero b{font-size:var(--t-d);line-height:.95;letter-spacing:-.02em}
details.guide{border-bottom:1px solid var(--hair)}
details.guide summary{padding:12px 0;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"›";color:var(--ink3);font-size:1.4rem;line-height:1;transform:rotate(90deg);transition:transform .15s}
details.guide[open] summary::after{transform:rotate(-90deg)}
details.guide .body{padding:0 0 14px;display:flex;flex-direction:column;gap:8px;max-width:65ch;color:var(--ink2)}
details.guide .body b{color:var(--ink)}
details.guide ul{margin:0;padding-left:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv b{white-space:nowrap}
.emojigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emojigrid button{border:1px solid var(--hair);background:var(--field);border-radius:10px;height:44px;font-family:var(--emoji);font-size:22px;display:grid;place-items:center}
.emojigrid button.on{box-shadow:inset 0 0 0 2px var(--ink)}
/* settings rows (More) */
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);width:100%;color:var(--ink);min-height:50px}
.srow .grow b{font-weight:600}
.srow .sub{display:block;color:var(--ink2);font-size:var(--t-l);margin-top:2px}
.srow .chev{color:var(--ink3);font-size:1.3rem;line-height:1;font-weight:300}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const PHOTO_BASE = "img/";
function thumbHTML(f, size){
  const cls = "thumb " + aisleClass(f.cat) + (size ? " " + size : "");
  if (f.img) return `<span class="${cls}"><img src="${f.img}" alt=""></span>`;
  const key = PHOTO[f.id];
  if (key) return `<span class="${cls} ph" aria-hidden="true"><img src="${PHOTO_BASE}${key}.webp" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.remove('ph');this.remove()"><i class="em">${foodEmoji(f)}</i></span>`;
  return `<span class="${cls}" aria-hidden="true">${foodEmoji(f)}</span>`;
}
const AVATAR_HUES = [152, 24, 205, 280, 340, 45, 190, 110];
function personHue(p){
  const name = (p && p.name) || "?"; let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return AVATAR_HUES[h % AVATAR_HUES.length];
}
// A person is a colour — a dot on rows, a stripe on their tray card. No initials bubbles.
function avatarHTML(p, size){
  return `<span class="avatar ${size || ""}" style="--h:${personHue(p)}" aria-hidden="true"></span>`;
}
// Product tile with its badge on the corner: the status dot and the number that matters (sodium per serving).
function tileHTML(f, lvl, value, size){

      if (f.fl >= F / 3) R.push({lvl:2, text:`Big pour: ${fmt(f.fl)} mL is ${pc}% of the whole day's ${fmt(F)} mL. Pour a small cup instead of drinking the whole thing.`});
      else R.push({lvl:1, text:`Counts as fluid: ${fmt(f.fl)} mL per ${f.serving} = ${pc}% of the ${fmt(F)} mL day.`});
    }
    if (has("wet")) I.push("Very watery food. Most fluid plans don't count it, but some do — ask the dietitian.");
    if (has("thirst") && f.fl === 0) G.push("Helps thirst without adding fluid");
    if (!c.sodium && f.na > 400) R.push({lvl:2, text:`Salty (${fmt(f.na)} mg) — salt makes you thirsty and hold water.`});
  }

  if (c.resp){
    if (has("carb")) R.push({lvl:2, text:"Carbonation bloats the stomach and pushes on the diaphragm — breathing gets harder."});
    if (has("gas")) R.push({lvl:2, text:"Gas-forming food. Bloating crowds the lungs — small portions, cooked soft."});
    if (has("fried")) R.push({lvl:2, text:"Greasy / fried food sits heavy and causes bloating."});
    if (f.sugar >= 20) R.push({lvl:2, text:`High sugar (${f.sugar} g). A load of simple carbs makes extra CO₂ for tired lungs to clear.`});
    if (has("chew")) R.push({lvl:2, text:"Tough to chew — tiring when short of breath. Choose tender or ground cuts."});
    if (!c.sodium && f.na > 400) R.push({lvl:2, text:`Salty (${fmt(f.na)} mg) — salt holds fluid, which strains breathing.`});
    if (has("protein")) G.push("Good protein — breathing muscles need it");
    if (has("caff")) I.push("Caffeine can clash with some breathing medicines — check with the pharmacist.");
  }

  if (c.diabetes){
    const Sg = +c.diabetes || 12;
    if (f.fl > 0 && f.sugar >= 10) R.push({lvl:3, text:`Sugary drink (${f.sugar} g sugar) — hits the blood sugar fast.`});
    else if (f.sugar >= Sg * 2) R.push({lvl:3, text:`Very high sugar: ${f.sugar} g per ${f.serving}.`});
    else if (f.sugar >= Sg) R.push({lvl:2, text:`Sugar: ${f.sugar} g per ${f.serving} — small portion, with a meal.`});
    if (f.carb >= 45) R.push({lvl:2, text:`Heavy carbs: ${f.carb} g per serving (about ${Math.round(f.carb / 15)} carb choices).`});
    if (f.fiber >= 4) G.push(`Fiber (${f.fiber} g) slows the sugar rise`);
    if (f.sugar === 0 && f.carb <= 5 && f.fl === 0 && (has("protein") || f.prot >= 10)) G.push("Protein, no sugar");
  }

  if (c.ckd){
    if (f.k >= 400) R.push({lvl:3, text:`High potassium: ${fmt(f.k)} mg per ${f.serving}.`});
    else if (f.k >= 250) R.push({lvl:2, text:`Moderate potassium: ${f.k} mg — small portion.`});
    if (has("phos")) R.push({lvl:3, text:'Phosphorus additives (look for "phos" in the ingredient list).'});
    else if (has("hiphos")) R.push({lvl:2, text:"Naturally high in phosphorus — limit."});
    if (has("ksub")) R.push({lvl:3, text:"Potassium-chloride salt substitute — dangerous with kidney disease."});
    if (!c.sodium && f.na > 400) R.push({lvl:2, text:`Salty (${fmt(f.na)} mg).`});
  }

  if (c.hik){
    if (f.k >= 400) R.push({lvl:3, text:`High potassium: ${fmt(f.k)} mg per ${f.serving} — the medicine already raises potassium.`});
    else if (f.k >= 250) R.push({lvl:2, text:`Moderate potassium: ${f.k} mg — small portion.`});
    if (has("ksub")) R.push({lvl:3, text:"Potassium-chloride salt substitute — avoid with potassium-raising medicines."});
  }

  if (c.lok){
    if (f.k >= 300) G.push(`Good potassium (${f.k} mg) — replaces what water pills flush out`);
    if (has("ksub")) I.push("Salt substitute adds potassium — only if the doctor said so.");
  }

  if (c.heart){
    if (f.sf >= 8) R.push({lvl:3, text:`Very high saturated fat: ${f.sf} g per ${f.serving}.`});
    else if (f.sf >= 5) R.push({lvl:2, text:`Saturated fat: ${f.sf} g per ${f.serving}.`});
    if (has("fried")) R.push({lvl:2, text:"Fried."});
    if (has("proc")) R.push({lvl:2, text:"Processed meat — saturated fat and salt."});
    if (has("omega")) G.push("Heart-healthy fats");
    if (f.fiber >= 4) G.push(`Fiber (${f.fiber} g)`);
    if (has("grapefruit") && !c.sodium) R.push({lvl:2, text:"Grapefruit interacts with statins and some blood-pressure medicines — ask the pharmacist."});
  }

  if (c.warfarin){
    if (has("vitk")) R.push({lvl:2, text:"High vitamin K. Fine to eat — just eat about the same amount every week so the warfarin dose stays steady."});
    if (has("alc")) R.push({lvl:2, text:"Alcohol changes how warfarin works."});
    if (has("grapefruit") && !c.sodium && !c.heart) R.push({lvl:2, text:"Grapefruit can change medicine levels — ask the pharmacist."});
  }

  if (c.gerd){
    const t = [];
    if (has("acid")) t.push("acidic");
    if (has("spicy")) t.push("spicy");
    if (has("caff")) t.push("caffeine");
    if (has("carb")) t.push("carbonated");
    if (has("fried")) t.push("fried");
    if (has("alc")) t.push("alcohol");
    if (f.sf >= 5 && !has("fried")) t.push("high-fat");
    if (t.length) R.push({lvl:2, text:`Reflux trigger: ${t.join(", ")}. Small amounts, not near bedtime.`});
  }

  if (c.gout){
    if (has("purine2")) R.push({lvl:3, text:"Very high purines — raises uric acid."});
    else if (has("purine")) R.push({lvl:2, text:"Moderate purines — small portions."});
    if (has("alc")) R.push({lvl:3, text:"Alcohol (especially beer) triggers gout flares."});
    if (f.fl > 0 && f.sugar >= 20) R.push({lvl:2, text:"Sugary drink — fructose raises uric acid."});
  }

  if (c.soft){
    if (has("hard") || has("chew")) R.push({lvl:3, text:"Hard, crunchy or tough — choking risk. Pick soft foods or cook until very soft."});
    else if (has("dry") || has("sticky")) R.push({lvl:2, text:"Dry or sticky — hard to swallow. Moisten it or skip."});
    else if (has("soft")) G.push("Soft texture");
  }

  if (c.lactose){
    if (has("lactose")) R.push({lvl:2, text:"High lactose — gas, cramps, diarrhea. A lactose-free version usually exists."});
    else if (has("dairy")) I.push("Dairy, but low in lactose (aged cheese, yogurt, butter) — usually tolerated.");
  }

  if (c.gluten){
    if (has("gluten") || has("wheat")) R.push({lvl:3, text:"Contains gluten."});
    else if (has("oats")) R.push({lvl:2, text:"Oats — only if the label says certified gluten-free."});
  }

  if (c.noalc && has("alc")) R.push({lvl:3, text:"Alcohol."});
  if (c.fiber && f.fiber >= 4) G.push(`Good fiber (${f.fiber} g) — helps constipation`);
  if (has("flavor")) G.push("Salt-free flavor");

  R.sort((a, b) => b.lvl - a.lvl);
  const lvl = R.length ? R[0].lvl : 0;
  return {lvl, reasons:R, goods:[...new Set(G)], infos:[...new Set(I)]};
}

// What to look for on the real package, for the active person's conditions
function labelTips(p){
  const c = (p && p.conds) || {}; const t = [];
  if (c.sodium){ const L = +c.sodium || 2000; t.push(`Sodium: 140 mg or less per serving is low. Over ${Math.round(L*0.2)} mg — put it back.`); }
  if (c.fluid) t.push("Fluid: anything liquid at room temperature counts. 1 cup = 240 mL, 8 fl oz = 240 mL, a 16.9 oz bottle = 500 mL.");
  if (c.resp) t.push("Breathing: skip carbonated drinks and gas-makers; pick high-protein, soft, small-portion foods.");
  if (c.diabetes) t.push("Diabetes: read Total Sugars and Total Carbohydrate per serving.");
  if (c.ckd || c.hik) t.push('Potassium: read the Potassium line; skip anything with "phos" in the ingredients.');
  if (c.heart) t.push("Fats: Saturated fat 5 g or less per serving, 0 g trans fat.");
  if (c.gluten) t.push('Gluten: look for "gluten-free" on the front; wheat, barley, rye and malt mean no.');
  if (c.soft) t.push("Texture: it should mash with a fork.");
  return t;
}

const LS_KEY = "traycard_v2";

  apply(d){
    if (!d || typeof d !== "object") return false;

    return true;

function drawPile(pile, items, n){

    <div id="shopSetup"></div>

function quickAddProfile(preset){
  const id = uid("p"); const p = {...preset, conds:{...preset.conds}, allergies:[...(preset.allergies||[])], created:Date.now()};
  S.sel.profileId = id; Store.put("profiles", id, p); toast(`${p.name} added`);
}
function quickAddStore(presetId){
  const pr = STORE_PRESETS.find(s => s.id === presetId); if (!pr) return;
  if (S.stores[pr.id]) { toast(`${pr.name} is already in your stores`); return; }
  Store.put("stores", pr.id, {name:pr.name, type:pr.type, note:"", created:Date.now()});
  if (!S.cart.storeId) { S.cart.storeId = pr.id; Store.saveCart(); }
  toast(`${pr.name} added`);
}
// Add one. If it came from somewhere on screen, the product itself drops into the tray.
function addToCart(id, from){
  const f = foodById(id); if (!f) return; const st = activeStore();
  const ex = S.cart.items.find(i => i.id === id);
  if (ex) ex.qty += 1; else S.cart.items.push({id, qty:1, price:priceFor(f, st), got:false, name:f.name});
  const fly = !!(from && from.rect && !reduceMotion() && S.ui.tab === "shop");
  if (fly) LANDING.add(id);
  Store.saveCart();
  if (!fly) return;
  const land = () => { LANDING.delete(id); const t = pileTile(id); if (t){ t.classList.remove("landing"); bump(t, -3); } bump($("#traybox"), 2); };
  const tile = pileTile(id);
  const target = tile ? tile.querySelector(".zone") : $("#pile .pmore");
  if (!target || !flyProduct(from, target, {onland:land, cutout:true})) land();
}
function changeQty(id, d){
  const ex = S.cart.items.find(i => i.id === id); if (!ex) return;
  const leaving = ex.qty + d <= 0;
  const tile = leaving && S.ui.tab === "shop" ? pileTile(id) : null;
  const from = tile ? snapZone(tile.querySelector(".zone")) : null;
  ex.qty += d; if (ex.qty <= 0) S.cart.items = S.cart.items.filter(i => i.id !== id);
  Store.saveCart();
  // taken back out of the tray: it goes back to its place on the shelf
  const home = from && slotZone(id);
  if (home && onScreen(home.getBoundingClientRect())){ home.classList.add("away"); if (!flyProduct(from, home, {dur:520, rot:6, cutout:true, onland:() => home.classList.remove("away")})) home.classList.remove("away"); }
}

  $("#findKey").hidden = finding; $("#catChips").hidden = finding; $("#findBar").hidden = !finding;

  chips.innerHTML = CATS.map((c, i) => `<button class="chip ${c === S.ui.cat ? "on" : ""}" role="tab" aria-selected="${c === S.ui.cat}" data-cat="${esc(c)}"><i>${String(i + 1).padStart(2, "0")}</i>${esc(c)}</button>`).join("");
  const on = $("#catChips .chip.on"); if (on && !finding && chips.dataset.cat !== S.ui.cat){ chips.scrollLeft = Math.max(0, on.offsetLeft - chips.offsetLeft - 30); chips.dataset.cat = S.ui.cat; }

const unitShort = u => String(u || "each").replace(/^per\s+/, "/");
const nb = s => s.replace(/ /g, " ");
function keyFacts(f, p){
  const c = (p && p.conds) || {}; const out = [];
  if (c.sodium || Object.keys(c).length === 0) out.push(`${f.na.toLocaleString()} mg sodium`);
  if (c.fluid && f.fl > 0) out.push(`${f.fl} mL`);
  if ((c.ckd || c.hik || c.lok) && f.k) out.push(`${f.k} mg potassium`);
  if (c.diabetes) out.push(`${f.sugar} g sugar`);
  if (c.heart && f.sf) out.push(`${f.sf} g sat fat`);
  if (c.resp && f.prot >= 10 && out.length < 3) out.push(`${f.prot} g protein`);
  return out.slice(0, 3);
}
// The one number on a tag: fluid for drinks that count as fluid, otherwise sodium per serving.
function tagFact(f, g){ return g.lvl === 1 && f.fl ? `${f.fl.toLocaleString()} mL` : `${f.na.toLocaleString()} mg`; }
function slotHTML(f, g, st, ci, away){
  const L = LEVELS[g.lvl];
  const sig = [g.lvl, ci ? ci.qty : 0, priceFor(f, st), unitFor(f, st), away ? 1 : 0, f.name, f.img ? "own" : (PHOTO[f.id] || f.emoji || "")].join("|");
  return `<article class="slot lv${g.lvl}" data-id="${esc(f.id)}" data-sig="${esc(sig)}">
      <button class="pkg" data-act="open" aria-label="${esc(f.name)}: ${esc(L.label)}. Show details">${zoneHTML(f, "shelf", "", away ? "away" : "")}</button>
      <div class="stag">
        <div class="band"><i class="led"></i>${esc(L.word)}<span class="n">${esc(tagFact(f, g))}</span></div>
        <div class="nm" data-act="open">${esc(f.name)}</div>
        <div class="foot">
          <span class="px"><b>${priceHTML(priceFor(f, st))}</b><span>${esc(unitShort(unitFor(f, st)))}</span></span>
          ${ci ? `<span class="qty"><button class="k" data-act="dec" aria-label="One less ${esc(f.name)}">${MINUS_ICON}</button><span class="lcd" aria-label="${ci.qty} on the list">${ci.qty}</span><button class="k" data-act="inc" aria-label="One more ${esc(f.name)}">${PLUS_ICON}</button></span>`
               : `<button class="k add" data-act="add" aria-label="Add ${esc(f.name)} to the list">${PLUS_ICON}</button>`}
        </div>
      </div>
    </article>`;
}
function renderFoodList(){
  const p = activeProfile(), st = activeStore(); if (!p || !st) return;
  const q = S.ui.q.trim().toLowerCase();
  let items = foodsAt(st);
  if (q) items = items.filter(f => f.name.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q));
  else items = items.filter(f => f.cat === S.ui.cat);
  const graded = items.map(f => ({f, g:gradeFood(f, p)}));
  const counts = [0, 0, 0, 0]; graded.forEach(x => counts[x.g.lvl]++); const avoidN = counts[3];
  let shown = graded;
  if (S.ui.filter === "noavoid") shown = graded.filter(x => x.g.lvl < 3);
  shown.sort((a, b) => a.g.lvl - b.g.lvl || a.f.name.localeCompare(b.f.name));
  const tally = counts.map((c, i) => c ? `<span class="t lv${i}"><i class="led"></i><b>${c}</b>${esc(LEVELS[i].word)}</span>` : "").join("");
  $("#shelfHead").innerHTML = `${q ? `<span>Search <b>“${esc(S.ui.q.trim())}”</b></span>` : ""}<span class="tally" aria-label="On this shelf">${tally || "Empty"}</span>${avoidN || S.ui.filter === "noavoid" ? `<span class="sw" data-act="avoid"><span>Hide avoid</span><button class="switch" role="switch" aria-checked="${S.ui.filter === "noavoid"}" aria-label="Hide foods marked Avoid"><i></i></button></span>` : ""}`;
  const inCart = Object.fromEntries(S.cart.items.map(i => [i.id, i]));
  const away = S.ui.item && S.ui.item.id;
  const list = $("#foodList");
  if (!shown.length){ list.innerHTML = `<div class="empty" style="grid-column:1/-1"><p>Nothing on this shelf${q ? ` matches “${esc(S.ui.q)}”` : " with this filter"}.</p><p class="tiny">Try another aisle, or add the food under More → Foods.</p></div>`; return; }
  const parts = shown.map(({f, g}) => slotHTML(f, g, st, inCart[f.id], away === f.id));
  const cur = [...list.children];
  if (cur.length === shown.length && cur.every((el, i) => el.dataset.id === shown[i].f.id)) cur.forEach((el, i) => patchSlot(el, parts[i]));
  else list.innerHTML = parts.join("");
}
// Same shelf, one slot changed: swap its tag and keep the product's picture where it is (no reload, no flicker).
function patchSlot(el, html){
  const t = document.createElement("template"); t.innerHTML = html.trim(); const nu = t.content.firstElementChild;
  if (!nu || el.dataset.sig === nu.dataset.sig) return;
  const oz = el.querySelector(".zone"), nz = nu.querySelector(".zone");
  if (oz && nz && oz.dataset.key && oz.dataset.key === nz.dataset.key && !oz.classList.contains("noimg")){
    el.className = nu.className; el.dataset.sig = nu.dataset.sig;
    el.querySelector(".stag").replaceWith(nu.querySelector(".stag"));
    el.querySelector(".pkg").setAttribute("aria-label", nu.querySelector(".pkg").getAttribute("aria-label"));
    oz.classList.toggle("away", nz.classList.contains("away"));
  } else el.replaceWith(nu);
}
const showGoods = g => g.goods.filter(t => !/^(Low sodium|Sodium-free)/.test(t));

// ===== The item, brought forward =====
function gaugeHTML(pct){ const on = Math.max(pct > 0 ? 1 : 0, Math.min(10, Math.round(pct / 10))); return Array.from({length:10}, (_, i) => `<i class="${i < on ? "on" : ""}"></i>`).join(""); }
// The numbers that matter for this person's diet order, pinned to the product itself.
function calloutsFor(f, p){
  const c = (p && p.conds) || {}; const out = [];
  const NA = +c.sodium || 2000, FL = +c.fluid || 1500;
  if (c.sodium || !Object.keys(c).length) out.push({k:"Sodium", v:`${f.na.toLocaleString()}<small> mg</small>`, pct:f.na / NA * 100 < 1 && f.na > 0 ? .5 : Math.round(f.na / NA * 100), lv:f.na > NA * .2 ? 3 : f.na > 140 ? 2 : 0});
  if (c.fluid && f.fl > 0) out.push({k:"Fluid", v:`${f.fl.toLocaleString()}<small> mL</small>`, pct:Math.round(f.fl / FL * 100), lv:f.fl >= FL / 3 ? 2 : 1});
  if ((c.ckd || c.hik || c.lok) && f.k) out.push({k:"Potassium", v:`${f.k.toLocaleString()}<small> mg</small>`, lv:c.lok ? 0 : f.k >= 400 ? 3 : f.k >= 250 ? 2 : 0});
  if (c.diabetes) out.push({k:"Sugar", v:`${f.sugar}<small> g</small>`, lv:f.sugar >= (+c.diabetes || 12) ? 2 : 0});
  if (c.heart) out.push({k:"Sat fat", v:`${f.sf}<small> g</small>`, lv:f.sf >= 5 ? 2 : 0});
  if (c.resp) out.push({k:"Protein", v:`${f.prot}<small> g</small>`, lv:0});
  if (!out.length) out.push({k:"Sodium", v:`${f.na.toLocaleString()}<small> mg</small>`, pct:Math.round(f.na / 2000 * 100), lv:f.na > 400 ? 3 : f.na > 140 ? 2 : 0});
  return out.slice(0, 3);
}
function itemFigure(f, p){
  const kind = "sheet", r = 11 / 16, zw = .62;
  const fit = !f.img && PHOTO[f.id] ? photoFit(PHOTO[f.id], kind) : null;
  const cos = calloutsFor(f, p), n = cos.length;
  const ax = fit ? (fit.bx + fit.bw * .8) * zw : .5 * zw;
  const pTop = fit ? fit.by : r * .3, pBot = fit ? fit.by + fit.bh : r * .95;
  let pins = "", lines = "", labels = "";
  cos.forEach((co, i) => {
    const yc = (i + .5) / n, ya = (pTop + (pBot - pTop) * (i + 1) / (n + 1)) / r;
    const X = (ax * 100).toFixed(1) + "%", YA = (ya * 100).toFixed(1) + "%", YC = (yc * 100).toFixed(1) + "%";
    lines += `<line x1="${X}" y1="${YA}" x2="64.5%" y2="${YC}"/>`;
    pins += `<span class="pin" style="left:${X};top:${YA}">${i + 1}</span>`;
    labels += `<div class="co lv${co.lv}" style="top:${YC}"><span class="kk"><i>${i + 1}</i>${esc(co.k)}</span><span class="v">${co.v}</span>${co.pct != null ? `<span class="kk"><span class="gauge" aria-hidden="true">${gaugeHTML(co.pct)}</span>${co.pct < 1 ? "&lt;1" : co.pct}%</span>` : ""}</div>`;
  });
  return `<div class="fig">${zoneHTML(f, kind, ' id="itemZone"')}<svg class="lines" aria-hidden="true">${lines}</svg>${pins}${labels}</div>`;
}
function itemActHTML(f){
  const ci = S.cart.items.find(i => i.id === f.id);
  return ci ? `<div class="onlist"><span class="kicker">On the list · <b class="num">${money(ci.qty * ci.price)}</b></span><span class="qty"><button class="k" data-x="dec" aria-label="One less">${MINUS_ICON}</button><span>${ci.qty}</span><button class="k" data-x="inc" aria-label="One more">${PLUS_ICON}</button></span></div>`
            : `<button class="btn primary block" data-x="add">Add to list</button>`;
}
function itemHTML(f, p, st){
  const g = gradeFood(f, p), L = LEVELS[g.lvl], goods = showGoods(g);
  const shownK = new Set(calloutsFor(f, p).map(c => c.k));
  const facts = [["Sodium", f.na + " mg"], ["Fluid", f.fl ? f.fl + " mL" : ""], ["Potassium", f.k + " mg"], ["Carbs", f.carb + " g"], ["Sugar", f.sugar + " g"], ["Fiber", f.fiber + " g"], ["Protein", f.prot + " g"], ["Sat fat", f.sf + " g"]]
    .filter(([k, v]) => v && !shownK.has(k)).map(([k, v]) => `${esc(k)} <b>${esc(v)}</b>`).join(" · ");
  return `<div class="top"><span>${aisleNo(f.cat)} ${esc(f.cat)} · ${esc(st.name)}</span><button class="btn sm" data-x="done">Done</button></div>
    ${itemFigure(f, p)}
    <div class="head"><h2>${esc(f.name)}</h2><span class="stamp lv${g.lvl}">${g.lvl === 0 ? "OK for " + esc(p.name) : esc(L.label)}</span></div>
    <div class="why">
      ${g.reasons.length ? g.reasons.map(r => `<div class="reason lv${r.lvl}"><i class="led"></i><span>${esc(r.text)}</span></div>`).join("") : `<div class="reason lv0"><i class="led"></i><span>Fits ${esc(p.name)}'s diet order.</span></div>`}
      ${goods.length ? `<div class="reason lv0"><i class="led"></i><span>${esc(goods.join(" · "))}</span></div>` : ""}
      ${g.infos.map(t => `<div class="reason muted"><span aria-hidden="true">ⓘ</span><span>${esc(t)}</span></div>`).join("")}
    </div>
    <div class="facts">Per ${esc(f.serving)}${facts ? " · " + facts : ""}<br>Typical values — check the real label.</div>
    <div class="pricebar"><span class="px"><b>${priceHTML(priceFor(f, st))}</b> ${esc(unitShort(unitFor(f, st)))} · estimate</span><button class="btn sm" data-x="fixprice">Fix price</button>${f.builtin ? "" : `<button class="btn sm" data-x="editfood">Edit food</button>`}</div>
    <div id="itAct">${itemActHTML(f)}</div>`;
}
function openItem(id){
  const f = foodById(id), p = activeProfile(), st = activeStore(); if (!f || !p || !st) return;
  const home = slotZone(id); const from = home ? snapZone(home) : null;
  openModal(itemHTML(f, p, st));
  const sheet = $("#modalRoot .sheet"); sheet.classList.add("item"); sheet.setAttribute("aria-label", f.name);
  S.ui.item = {id};
  if (home) home.classList.add("away");
  sheet.addEventListener("click", e => {
    const b = e.target.closest("[data-x]"); if (!b) return; const x = b.dataset.x;
    if (x === "done") closeModal();
    if (x === "add"){ const snap = snapZone($("#itemZone")); S.ui.item = null; const h = slotZone(id); if (h) h.classList.remove("away"); closeModal(); addToCart(id, snap); }
    if (x === "inc" || x === "dec"){ if (x === "inc") addToCart(id); else changeQty(id, -1); const a = $("#itAct"); if (a) a.innerHTML = itemActHTML(f); }
    if (x === "fixprice") openPriceModal(id);

    const to = snapZone(zone); zone.classList.add("away");
    sheet.animate([{transform:"translateY(28px)", opacity:0}, {transform:"none", opacity:1}], {duration:260, easing:"cubic-bezier(.2,.8,.2,1)"});
    if (!flyProduct(from, to, {dur:500, lift:24, rot:0, onland:() => zone.classList.remove("away")})) zone.classList.remove("away");
  } else if (sheet.animate && !reduceMotion()) sheet.animate([{transform:"translateY(28px)", opacity:0}, {transform:"none", opacity:1}], {duration:260});
}
// Closing the item: it shrinks back into its own place on the shelf.
function leaveItem(fly){
  const it = S.ui.item; S.ui.item = null; if (!it) return;
  const home = slotZone(it.id); if (!home) return;
  const back = () => home.classList.remove("away");
  const zone = $("#itemZone");
  if (fly && zone && S.ui.tab === "shop" && !reduceMotion()){
    const to = snapZone(home);
    if (onScreen(to.rect) && flyProduct(snapZone(zone), to, {dur:440, lift:16, rot:0, onland:back})) return;
  }

function openTripSheet(){
  const p = activeProfile(), st = activeStore(); if (!p || !st) return;
  const render = () => {
    const p = activeProfile(), st = activeStore();

function buildCart(){

    if (act === "remove" && it){ S.cart.items = S.cart.items.filter(i => i.id !== id); Store.saveCart(); toast(`${it.name || "Item"} removed`); }

function remainText(total, budget){
  if (!budget) return "No budget set";

}
function updateCartTotals(){

  $$("[data-remain]").forEach(el => { const over = !!budget && total > budget; el.textContent = el.classList.contains("dim") ? (budget ? `· ${over ? money(total - budget) + " over" : money(budget - total) + " left"}` : "") : remainText(total, budget); el.classList.toggle("over", over); });
  const bar = $("#cartBar"); if (bar && budget){ const pc = Math.min(100, total / budget * 100); bar.querySelector("i").style.width = pc + "%"; bar.className = "bar " + (total > budget ? "over" : pc > 85 ? "warn" : ""); }

function buildHistory(){

function shrinkImage(file, size){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { try{
      const c = document.createElement("canvas"); c.width = size; c.height = size; const ctx = c.getContext("2d");
      const s = Math.min(im.width, im.height); const sx = (im.width - s) / 2, sy = (im.height - s) / 2;
      ctx.drawImage(im, sx, sy, s, s, 0, 0, size, size); URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.82));
    }catch(e){ reject(e); } };
    im.onerror = reject; im.src = url;
  });
}

function plainDownload(filename, data, type){
  try{
    const blob = new Blob([data], {type}); const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; a.rel = "noopener"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); return true;
  }catch(e){ return false; }
}

  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Date","Store","Person","Item","Qty","Price each","Line total","Bought","Trip total","Budget","Note"]];
  trips.forEach(t => t.items.forEach(i => rows.push([t.date, t.storeName, t.profileName, i.name, i.qty, (+i.price).toFixed(2), (i.qty * i.price).toFixed(2), i.got ? "yes" : "no", (+t.total).toFixed(2), t.budget || "", t.note || ""])));
  const csv = rows.map(r => r.map(q).join(",")).join("\n");
  let dl = null; try{ if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); }catch(e){}
  if (dl){ try{ await dl.save({filename:`grocery-history-${todayISO()}.csv`, data:csv}); toast("Saved"); return; }catch(e){ if (e && e.code === "declined") return; } }
  if (plainDownload(`grocery-history-${todayISO()}.csv`, csv, "text/csv")){ toast("CSV file ready"); return; }
  $("#exportBox").innerHTML = `<div class="stack"><p class="small muted">Copy this into a spreadsheet:</p><textarea id="exportText" class="input" rows="6" readonly>${esc(csv)}</textarea><button class="btn sm" data-act="copyexport">Copy</button></div>`;
}

const GUIDE = [
  {t:"How the colors work", b:`<p><span class="badge l0">OK</span> fits every diet order the person has.</p><p><span class="badge l1">Counts as fluid</span> fine to buy, but every sip comes out of the day's fluid allowance — the card shows how much.</p><p><span class="badge l2">Limit</span> small portion, once in a while, or a caution about medicines. Read the reason.</p><p><span class="badge l3">Avoid</span> breaks a rule outright (very high sodium, an allergy, alcohol on a no-alcohol order). Look for the swap suggested in the reason.</p><p class="muted">Numbers are typical values for a generic version of the food. Brands differ, so the app also tells you what to look for on the real label.</p>`},
  {t:"2 g sodium diet (heart failure, blood pressure)", b:`<p>2 grams = 2,000 mg a day, spread over all meals and snacks. Most of the salt in a diet comes from packaged food, not the shaker.</p><ul><li><b>Low sodium</b> on a label means 140 mg or less per serving — the target for most items.</li><li><b>Very low</b> = 35 mg or less. <b>Sodium-free</b> = under 5 mg.</li><li><b>Reduced sodium</b> only means 25% less than the regular version — soy sauce and soups can still be very high.</li><li><b>No salt added</b> is the phrase to hunt for on canned vegetables, beans, tomatoes, broth and tuna.</li><li>Anything over 400 mg per serving (20% of the day) is a put-it-back item.</li></ul><p><b>Biggest offenders:</b> deli meat, bacon, sausage, hot dogs, canned soup, ramen, frozen dinners, pizza, cheese, pickles, olives, soy sauce, seasoning salts, bouillon, biscuits, boxed rice and pasta mixes.</p><p><b>Swaps:</b> fresh or frozen plain meat instead of deli; no-salt-added cans, or rinse regular canned beans and vegetables (drops sodium by about a third); Swiss or fresh mozzarella instead of cheddar or American; salt-free seasoning blends, garlic and onion powder, lemon, vinegar, pepper, fresh herbs for flavor.</p><p>Chicken, pork and shrimp are sometimes injected with salt water — the package says "enhanced" or "contains up to 15% solution". Buy plain.</p>`},
  {t:"1,500 mL fluid restriction", b:`<p>Everything that is liquid at room temperature counts, not just water: coffee, tea, milk, juice, soda, soup and broth, nutrition shakes, ice (half its volume), ice cream, sherbet, popsicles, Jell-O, pudding, yogurt, gravy, creamer.</p><div class="kv"><b>1 cup / 8 fl oz</b><span>240 mL</span><b>1 fl oz</b><span>30 mL</span><b>16.9 oz water bottle</b><span>500 mL — a third of the day</span><b>12 oz can</b><span>355 mL</span><b>Popsicle</b><span>about 75 mL</span><b>Jell-O or pudding cup</b><span>about 100 mL</span><b>Scoop of ice cream</b><span>about 120 mL</span><b>Bowl of soup</b><span>240–360 mL</span></div><p><b>Making it easier:</b> use small cups; spread fluids through the day; take pills with meal fluids instead of an extra glass; sugar-free hard candy or gum, a lemon wedge, or rinsing and spitting for a dry mouth; avoid salty food, which drives thirst.</p><p>Many heart-failure plans also ask for a daily morning weight. A gain of 2–3 lb in a day or 5 lb in a week usually means call the clinic — that is fluid, not fat.</p>`},
  {t:"Chronic respiratory failure / COPD", b:`<ul><li><b>Small, frequent meals</b> (5–6 a day). A full stomach pushes up on the diaphragm and makes breathing harder.</li><li><b>Skip gas-makers</b> and carbonated drinks: beans, cabbage, broccoli, cauliflower, Brussels sprouts, onions, corn, soda, sparkling water, fried food.</li><li><b>Protein at every meal</b> — eggs, chicken, fish, Greek yogurt, cottage cheese, protein shakes. Breathing burns calories, and the breathing muscles need protein.</li><li><b>Go easy on sugar and refined carbs.</b> Burning a big load of simple carbs produces extra carbon dioxide that tired lungs have to clear. Healthy fats (olive oil, avocado, nuts, fish) are a gentler fuel.</li><li><b>Salt</b> makes the body hold fluid, which strains breathing — the sodium rule helps here too.</li><li><b>Soft, easy-to-chew foods</b> on short-of-breath days; rest before meals, eat slowly, sit upright.</li><li>Fluids thin mucus, but a doctor's fluid restriction always wins over "drink more".</li><li>If on steroid pills or inhalers long term, calcium and vitamin D (milk, yogurt, fortified foods) protect the bones.</li></ul>`},
  {t:"Other diet orders you can turn on", b:`<ul><li><b>Diabetes</b> — watches Total Sugars and Total Carbohydrate per serving; sugary drinks are red. Fiber gets a green note.</li><li><b>Kidney disease</b> — flags potassium (250 mg+ limit, 400 mg+ avoid) and phosphorus additives (any ingredient with "phos"). Never use potassium-chloride salt substitute.</li><li><b>High potassium / potassium-raising meds</b> (spironolactone, lisinopril, losartan) — same potassium flags.</li><li><b>Needs extra potassium</b> (water pills like furosemide/Lasix) — bananas, potatoes, oranges, tomatoes, yogurt get a green note. Ask the doctor which potassium rule applies; they conflict.</li><li><b>Cholesterol</b> — saturated fat 5 g+ per serving is a limit; fried and processed meats too.</li><li><b>Warfarin</b> — leafy greens are fine, just keep the amount steady week to week.</li><li><b>Reflux</b> — acidic, spicy, fried, fatty, caffeine, carbonated, alcohol.</li><li><b>Gout</b> — organ meats and sardines avoid; shellfish and beer limit.</li><li><b>Soft diet</b> — hard, crunchy or tough foods are red; soft gets a green note.</li><li><b>Lactose</b> — milk and ice cream limit; aged cheese and yogurt usually fine.</li><li><b>Gluten-free</b> — wheat, barley, rye, most bread, pasta, crackers, soy sauce and beer are red; oats only if certified.</li><li><b>Allergies</b> — anything containing the allergen is red.</li></ul>`},
  {t:"Shopping and price tips", b:`<ul><li>Shop the outside walls first: produce, meat, dairy, frozen plain vegetables. Most red items live in the middle aisles.</li><li>"Heart healthy", "natural" and "organic" on the front say nothing about sodium. Turn it over.</li><li>Bulk clubs are fine for staples — portion big packs into freezer bags the day you get home.</li><li>Prices here start as estimates. Fix a price on any item (open it → Fix price) and the app remembers it for that store; prices you enter at checkout are remembered too.</li><li>Finish Trip saves the receipt total, what was bought and what was skipped, so next week you can tap "Shop this list again".</li><li>Everything stays on your own phone or computer. Other people can use this same page for their own family — nobody sees anyone else's lists.</li></ul>`}
];

function boot(){
  buildShop(); buildCart(); buildHistory(); buildPeople(); buildMore();
  $("#tabbar").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });

  const qParam = params.get("q"); if (qParam){ S.ui.q = qParam; const qi = $("#q"); if (qi) qi.value = qParam; }
  const h = (location.hash || "").slice(1); if (["shop","cart","history","people","more"].includes(h)) S.ui.tab = h;
  setSync(); render();
}
